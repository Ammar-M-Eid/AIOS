<svg xmlns="http://www.w3.org/2000/svg" width="1700px" height="900px" viewBox="0 0 1700 900"><rect width="100%" height="100%" fill="white"/><style>text{font-family:Arial,Helvetica,sans-serif;fill:#14263d}</style><text x="45" y="48" font-size="32" font-weight="700">Operational Context — AIOS</text><text x="47" y="82" font-size="18" fill="#64748b">System scope, users, target workloads, and host-facing interactions.</text><circle cx="185.0" cy="360" r="18" fill="#f0f7ec" stroke="#087f73" stroke-width="2"/><path d="M185.0 378v24m-27 19q27-35 54 0m-27-20-20 34m20-34 20 34" fill="none" stroke="#087f73" stroke-width="2.5" stroke-linecap="round"/><rect x="55" y="423" width="260" height="105" rx="12" fill="#eaf3fb" stroke="#1769aa" stroke-width="2"/><text x="185.0" y="459" text-anchor="middle" font-size="20" font-weight="700" fill="#14263d"><tspan x="185.0" dy="0">Sysadmin / SRE</tspan></text><text x="185.0" y="484" text-anchor="middle" font-size="14" font-weight="400" fill="#64748b"><tspan x="185.0" dy="0">Person · read-only viewer</tspan></text><text x="185.0" y="507" text-anchor="middle" font-size="16" font-weight="400" fill="#14263d"><tspan x="185.0" dy="0">Reviews dashboard</tspan><tspan x="185.0" dy="21">projections.</tspan></text><rect x="620" y="300" width="430" height="300" rx="12" fill="#eaf3fb" stroke="#1769aa" stroke-width="2"/><text x="835.0" y="336" text-anchor="middle" font-size="20" font-weight="700" fill="#14263d"><tspan x="835.0" dy="0">AIOS</tspan></text><text x="835.0" y="361" text-anchor="middle" font-size="14" font-weight="400" fill="#64748b"><tspan x="835.0" dy="0">Autonomous Linux performance optimizer</tspan></text><text x="835.0" y="384" text-anchor="middle" font-size="16" font-weight="400" fill="#14263d"><tspan x="835.0" dy="0">Observe CPU, RAM, I/O, and PSI.</tspan><tspan x="835.0" dy="21">Produce per-process recommendations.</tspan><tspan x="835.0" dy="21">Apply only separately gated, verified</tspan><tspan x="835.0" dy="21">controls.</tspan></text><rect x="1260" y="190" width="370" height="210" rx="12" fill="#eef2f6" stroke="#64748b" stroke-width="2"/><text x="1445.0" y="226" text-anchor="middle" font-size="20" font-weight="700" fill="#14263d"><tspan x="1445.0" dy="0">Target workloads</tspan></text><text x="1445.0" y="251" text-anchor="middle" font-size="14" font-weight="400" fill="#64748b"><tspan x="1445.0" dy="0">Selected Linux processes and cgroups</tspan></text><text x="1445.0" y="274" text-anchor="middle" font-size="16" font-weight="400" fill="#14263d"><tspan x="1445.0" dy="0">State is inspected before a</tspan><tspan x="1445.0" dy="21">decision.</tspan></text><rect x="1260" y="545" width="370" height="230" rx="12" fill="#eef2f6" stroke="#64748b" stroke-width="2"/><text x="1445.0" y="581" text-anchor="middle" font-size="20" font-weight="700" fill="#14263d"><tspan x="1445.0" dy="0">Ubuntu 24.04 Linux host</tspan></text><text x="1445.0" y="606" text-anchor="middle" font-size="14" font-weight="400" fill="#64748b"><tspan x="1445.0" dy="0">External host and kernel interfaces</tspan></text><text x="1445.0" y="629" text-anchor="middle" font-size="16" font-weight="400" fill="#14263d"><tspan x="1445.0" dy="0">procfs / PSI observations;</tspan><tspan x="1445.0" dy="21">supported cgroups v2 controls.</tspan></text><path d="M 315 465 L 620 465" fill="none" stroke="#64748b" stroke-width="2.2" stroke-dasharray="8 7" stroke-linejoin="round"/><path d="M608.0 470.0L620 465L608.0 460.0" fill="none" stroke="#64748b" stroke-width="2.2" stroke-linecap="round"/><rect x="330.0" y="398" width="270" height="30" rx="5" fill="white"/><text x="465" y="419" text-anchor="middle" font-size="14" font-weight="700" fill="#14263d"><tspan x="465" dy="0">read-only status · local HTTP GET</tspan></text><path d="M 1050 365 L 1260 300" fill="none" stroke="#64748b" stroke-width="2.2" stroke-dasharray="8 7" stroke-linejoin="round"/><path d="M1250.0149879520595 308.3246341903103L1260 300L1247.0581506713484 298.77177528339683" fill="none" stroke="#64748b" stroke-width="2.2" stroke-linecap="round"/><rect x="980.0" y="268" width="350" height="30" rx="5" fill="white"/><text x="1155" y="289" text-anchor="middle" font-size="14" font-weight="700" fill="#14263d"><tspan x="1155" dy="0">reads selected process state · procfs / cgroups v2</tspan></text><path d="M 1050 510 L 1260 650" fill="none" stroke="#64748b" stroke-width="2.2" stroke-dasharray="8 7" stroke-linejoin="round"/><path d="M1247.2418954868199 647.5038491169864L1260 650L1252.788897449072 639.183346173608" fill="none" stroke="#64748b" stroke-width="2.2" stroke-linecap="round"/><rect x="980.0" y="583" width="350" height="30" rx="5" fill="white"/><text x="1155" y="604" text-anchor="middle" font-size="14" font-weight="700" fill="#14263d"><tspan x="1155" dy="0">requests bounded resource controls · cgroups v2</tspan></text><path d="M 1445 400 L 1445 545" fill="none" stroke="#64748b" stroke-width="2.2" stroke-dasharray="8 7" stroke-linejoin="round"/><path d="M1440.0 533.0L1445 545L1450.0 533.0" fill="none" stroke="#64748b" stroke-width="2.2" stroke-linecap="round"/><rect x="1315.0" y="468" width="260" height="30" rx="5" fill="white"/><text x="1445" y="489" text-anchor="middle" font-size="14" font-weight="700" fill="#14263d"><tspan x="1445" dy="0">workloads run on · Ubuntu Linux</tspan></text><rect x="90" y="825" width="1520" height="50" rx="10" fill="#fff6df" stroke="#e7cc83"/><text x="850" y="856" text-anchor="middle" font-size="15">AIOS is in scope. The sysadmin, selected workloads, and Linux host are external to the system boundary.</text></svg>