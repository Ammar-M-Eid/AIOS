<text x="1310" y="1085" text-anchor="middle" font-family="Arial" font-size="18" font-weight="700" fill="#103a5c">UC-15</text>
<text x="1310" y="1117" text-anchor="middle" font-family="Arial" font-size="16" fill="#243b53">Measure overhead and</text>
<text x="1310" y="1139" text-anchor="middle" font-family="Arial" font-size="16" fill="#243b53">workload impact</text>
<ellipse cx="1720" cy="1115" rx="150" ry="72" fill="#eef5fb" stroke="#2471a3" stroke-width="3"/>
<text x="1720" y="1085" text-anchor="middle" font-family="Arial" font-size="18" font-weight="700" fill="#103a5c">UC-13</text>
<text x="1720" y="1117" text-anchor="middle" font-family="Arial" font-size="16" fill="#243b53">Append and verify audit</text>
<text x="1720" y="1139" text-anchor="middle" font-family="Arial" font-size="16" fill="#243b53">history</text>
<ellipse cx="900" cy="1400" rx="150" ry="72" fill="#f2effb" stroke="#7454a6" stroke-width="3"/>
<text x="900" y="1370" text-anchor="middle" font-family="Arial" font-size="18" font-weight="700" fill="#103a5c">UC-17</text>
<text x="900" y="1402" text-anchor="middle" font-family="Arial" font-size="16" fill="#243b53">Read operational status</text>
<text x="900" y="1424" text-anchor="middle" font-family="Arial" font-size="16" fill="#243b53">and outcome projection</text>
<ellipse cx="1310" cy="1400" rx="150" ry="72" fill="#f2effb" stroke="#7454a6" stroke-width="3"/>
<text x="1310" y="1370" text-anchor="middle" font-family="Arial" font-size="18" font-weight="700" fill="#103a5c">UC-18</text>
<text x="1310" y="1402" text-anchor="middle" font-family="Arial" font-size="16" fill="#243b53">Read audit summary and</text>
<text x="1310" y="1424" text-anchor="middle" font-family="Arial" font-size="16" fill="#243b53">verification status</text>
