<text x="490" y="230" text-anchor="middle" font-family="Arial" font-size="18" font-weight="700" fill="#103a5c">UC-01</text>
<text x="490" y="262" text-anchor="middle" font-family="Arial" font-size="16" fill="#243b53">Check host readiness and</text>
<text x="490" y="284" text-anchor="middle" font-family="Arial" font-size="16" fill="#243b53">capabilities</text>
<ellipse cx="900" cy="260" rx="150" ry="72" fill="#eef5fb" stroke="#2471a3" stroke-width="3"/>
<text x="900" y="230" text-anchor="middle" font-family="Arial" font-size="18" font-weight="700" fill="#103a5c">UC-02</text>
<text x="900" y="262" text-anchor="middle" font-family="Arial" font-size="16" fill="#243b53">Collect CPU, RAM, I/O and</text>
<text x="900" y="284" text-anchor="middle" font-family="Arial" font-size="16" fill="#243b53">PSI observations</text>
<ellipse cx="1310" cy="260" rx="150" ry="72" fill="#eef5fb" stroke="#2471a3" stroke-width="3"/>
<text x="1310" y="230" text-anchor="middle" font-family="Arial" font-size="18" font-weight="700" fill="#103a5c">UC-03</text>
<text x="1310" y="262" text-anchor="middle" font-family="Arial" font-size="16" fill="#243b53">Validate sample quality</text>
<text x="1310" y="284" text-anchor="middle" font-family="Arial" font-size="16" fill="#243b53">and process identity</text>
<ellipse cx="1720" cy="260" rx="150" ry="72" fill="#eef5fb" stroke="#2471a3" stroke-width="3"/>
<text x="1720" y="230" text-anchor="middle" font-family="Arial" font-size="18" font-weight="700" fill="#103a5c">UC-04</text>
<text x="1720" y="262" text-anchor="middle" font-family="Arial" font-size="16" fill="#243b53">Persist bounded telemetry</text>
<ellipse cx="490" cy="545" rx="150" ry="72" fill="#eef5fb" stroke="#2471a3" stroke-width="3"/>
<text x="490" y="515" text-anchor="middle" font-family="Arial" font-size="18" font-weight="700" fill="#103a5c">UC-05</text>
<text x="490" y="547" text-anchor="middle" font-family="Arial" font-size="16" fill="#243b53">Generate provenance-bound</text>
<text x="490" y="569" text-anchor="middle" font-family="Arial" font-size="16" fill="#243b53">prediction</text>
<ellipse cx="900" cy="545" rx="150" ry="72" fill="#eef5fb" stroke="#2471a3" stroke-width="3"/>
<text x="900" y="515" text-anchor="middle" font-family="Arial" font-size="18" font-weight="700" fill="#103a5c">UC-06</text>
<text x="900" y="547" text-anchor="middle" font-family="Arial" font-size="16" fill="#243b53">Decide per-process</text>
<text x="900" y="569" text-anchor="middle" font-family="Arial" font-size="16" fill="#243b53">outcome</text>
<ellipse cx="1310" cy="545" rx="150" ry="72" fill="#eef5fb" stroke="#2471a3" stroke-width="3"/>
<text x="1310" y="515" text-anchor="middle" font-family="Arial" font-size="18" font-weight="700" fill="#103a5c">UC-07</text>
<text x="1310" y="547" text-anchor="middle" font-family="Arial" font-size="16" fill="#243b53">Apply policy admission</text>
<text x="1310" y="569" text-anchor="middle" font-family="Arial" font-size="16" fill="#243b53">gates</text>
<ellipse cx="1720" cy="545" rx="150" ry="72" fill="#fff7e8" stroke="#d28a22" stroke-width="3"/>
<text x="1720" y="515" text-anchor="middle" font-family="Arial" font-size="18" font-weight="700" fill="#103a5c">UC-08</text>
<text x="1720" y="547" text-anchor="middle" font-family="Arial" font-size="16" fill="#243b53">Authenticate and</text>
<text x="1720" y="569" text-anchor="middle" font-family="Arial" font-size="16" fill="#243b53">revalidate actuator</text>
<text x="1720" y="591" text-anchor="middle" font-family="Arial" font-size="16" fill="#243b53">request</text>
<ellipse cx="490" cy="830" rx="150" ry="72" fill="#eef5fb" stroke="#2471a3" stroke-width="3"/>
<text x="490" y="800" text-anchor="middle" font-family="Arial" font-size="18" font-weight="700" fill="#103a5c">UC-09</text>
<text x="490" y="832" text-anchor="middle" font-family="Arial" font-size="16" fill="#243b53">Apply guarded CPU control</text>
<ellipse cx="900" cy="830" rx="150" ry="72" fill="#eef5fb" stroke="#2471a3" stroke-width="3"/>
<text x="900" y="800" text-anchor="middle" font-family="Arial" font-size="18" font-weight="700" fill="#103a5c">UC-10</text>
<text x="900" y="832" text-anchor="middle" font-family="Arial" font-size="16" fill="#243b53">Apply guarded RAM control</text>
<ellipse cx="1310" cy="830" rx="150" ry="72" fill="#eef5fb" stroke="#2471a3" stroke-width="3"/>
<text x="1310" y="800" text-anchor="middle" font-family="Arial" font-size="18" font-weight="700" fill="#103a5c">UC-11</text>
<text x="1310" y="832" text-anchor="middle" font-family="Arial" font-size="16" fill="#243b53">Apply guarded</text>
<text x="1310" y="854" text-anchor="middle" font-family="Arial" font-size="16" fill="#243b53">device-specific I/O</text>
<text x="1310" y="876" text-anchor="middle" font-family="Arial" font-size="16" fill="#243b53">control</text>
<ellipse cx="1720" cy="830" rx="150" ry="72" fill="#eef5fb" stroke="#2471a3" stroke-width="3"/>
<text x="1720" y="800" text-anchor="middle" font-family="Arial" font-size="18" font-weight="700" fill="#103a5c">UC-12</text>
<text x="1720" y="832" text-anchor="middle" font-family="Arial" font-size="16" fill="#243b53">Inhibit and recover on</text>
<text x="1720" y="854" text-anchor="middle" font-family="Arial" font-size="16" fill="#243b53">unsafe runtime</text>
<ellipse cx="490" cy="1115" rx="150" ry="72" fill="#eef5fb" stroke="#2471a3" stroke-width="3"/>
<text x="490" y="1085" text-anchor="middle" font-family="Arial" font-size="18" font-weight="700" fill="#103a5c">UC-16</text>
<text x="490" y="1117" text-anchor="middle" font-family="Arial" font-size="16" fill="#243b53">Review least privilege</text>
<text x="490" y="1139" text-anchor="middle" font-family="Arial" font-size="16" fill="#243b53">and evidence status</text>
<ellipse cx="900" cy="1115" rx="150" ry="72" fill="#e9f6ee" stroke="#27834a" stroke-width="3"/>
<text x="900" y="1085" text-anchor="middle" font-family="Arial" font-size="18" font-weight="700" fill="#103a5c">UC-14</text>
<text x="900" y="1117" text-anchor="middle" font-family="Arial" font-size="16" fill="#243b53">Review status and</text>
<text x="900" y="1139" text-anchor="middle" font-family="Arial" font-size="16" fill="#243b53">outcomes (read-only)</text>
