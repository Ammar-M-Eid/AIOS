<svg xmlns="http://www.w3.org/2000/svg" width="2700px" height="1500px" viewBox="0 0 2700 1500"><defs><marker id="arr" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8" fill="#5e7895"/></marker><style>text{font-family:Arial,Helvetica,sans-serif;fill:#14263d}</style></defs><rect width="100%" height="100%" fill="#fff"/><text x="54" y="58" font-size="34" font-weight="700">AIOS Runtime Architecture</text><text x="56" y="95" font-size="19" fill="#52657d">Responsibility-focused view of telemetry, inference, policy, guarded actuation, persistence, and read-only oversight.</text><rect x="250" y="155" width="1920" height="1190" rx="22" fill="#fbfdff" stroke="#1769aa" stroke-width="2.4"/><path d="M148 605 L330 330" fill="none" stroke="#5e7895" stroke-width="2.5" stroke-dasharray="9 7" marker-end="url(#arr)"/><path d="M1200 330 L1290 330" fill="none" stroke="#5e7895" stroke-width="2.5" stroke-dasharray="9 7" marker-end="url(#arr)"/><path d="M1485 410 L1485 760" fill="none" stroke="#5e7895" stroke-width="2.5" stroke-dasharray="9 7" marker-end="url(#arr)"/><path d="M1770 330 L1680 330" fill="none" stroke="#5e7895" stroke-width="2.5" stroke-dasharray="9 7" marker-end="url(#arr)"/><path d="M720 840 L810 840" fill="none" stroke="#5e7895" stroke-width="2.5" stroke-dasharray="9 7" marker-end="url(#arr)"/><path d="M1005 760 L1005 410" fill="none" stroke="#5e7895" stroke-width="2.5" stroke-dasharray="9 7" marker-end="url(#arr)"/><path d="M1680 840 L1770 840" fill="none" stroke="#5e7895" stroke-width="2.5" stroke-dasharray="9 7" marker-end="url(#arr)"/><path d="M1680 790 L1730 790 L1730 535 L2245 535 L2245 650 L2300 650" fill="none" stroke="#5e7895" stroke-width="2.5" stroke-dasharray="9 7" marker-end="url(#arr)"/><path d="M720 870 L760 870 L760 1240 L2475 1240 L2475 735" fill="none" stroke="#5e7895" stroke-width="2.5" stroke-dasharray="9 7" marker-end="url(#arr)"/><path d="M720 370 L760 370 L760 820 L810 820" fill="none" stroke="#5e7895" stroke-width="2.5" stroke-dasharray="9 7" marker-end="url(#arr)"/><path d="M1680 370 L1735 370 L1735 620 L1770 620 L1770 760" fill="none" stroke="#5e7895" stroke-width="2.5" stroke-dasharray="9 7" marker-end="url(#arr)"/><path d="M720 390 L745 390 L745 1320 L2200 1320 L2200 1050 L2120 1050 L2120 920" fill="none" stroke="#5e7895" stroke-width="2.5" stroke-dasharray="9 7" marker-end="url(#arr)"/><text x="280" y="190" font-size="17" font-weight="700" fill="#1769aa" text-anchor="start">AIOS proposed runtime boundary</text><circle cx="88" cy="520" r="18" fill="#f0f7ec" stroke="#087f73" stroke-width="2.5"/><path d="M88 538v35m-28 22q28-38 56 0m-28-22-20 36m20-36 20 36" fill="none" stroke="#087f73" stroke-width="2.7" stroke-linecap="round"/><rect x="28" y="605" width="120" height="82" rx="12" fill="#eaf3fb" stroke="#1769aa" stroke-width="2"/><text x="88" y="638" font-size="15" font-weight="700" fill="#14263d" text-anchor="middle">Sysadmin / SRE</text><text x="88" y="663" font-size="13" font-weight="400" fill="#52657d" text-anchor="middle">Read-only viewer</text><rect x="330" y="250" width="390" height="160" rx="14" fill="#eaf3fb" stroke="#1769aa" stroke-width="2.5"/><text x="525" y="288" font-size="20" font-weight="700" fill="#14263d" text-anchor="middle">Read-only Dashboard API</text><text x="525" y="314" font-size="14" font-weight="400" fill="#52657d" text-anchor="middle">FastAPI · local read-only projection</text><text x="525" y="344" font-size="16" font-weight="400" fill="#14263d" text-anchor="middle">Status, health, recommendations,</text><text x="525" y="366" font-size="16" font-weight="400" fill="#14263d" text-anchor="middle">and audit summary.</text><rect x="810" y="250" width="390" height="160" rx="14" fill="#eaf3fb" stroke="#1769aa" stroke-width="2.5"/><text x="1005" y="288" font-size="20" font-weight="700" fill="#14263d" text-anchor="middle">AI Inference Service</text><text x="1005" y="314" font-size="14" font-weight="400" fill="#52657d" text-anchor="middle">Proposed service · model TBD</text><text x="1005" y="344" font-size="16" font-weight="400" fill="#14263d" text-anchor="middle">Reads bounded evidence and</text><text x="1005" y="366" font-size="16" font-weight="400" fill="#14263d" text-anchor="middle">returns a prediction.</text><rect x="1290" y="250" width="390" height="160" rx="14" fill="#eaf3fb" stroke="#1769aa" stroke-width="2.5"/><text x="1485" y="288" font-size="20" font-weight="700" fill="#14263d" text-anchor="middle">Decision &amp; Policy Service</text><text x="1485" y="314" font-size="14" font-weight="400" fill="#52657d" text-anchor="middle">Per-process · separate resource gates</text><text x="1485" y="344" font-size="16" font-weight="400" fill="#14263d" text-anchor="middle">Applies OBSERVE_ONLY default,</text><text x="1485" y="366" font-size="16" font-weight="400" fill="#14263d" text-anchor="middle">eligibility, bounds, and cooldowns.</text><rect x="1770" y="250" width="350" height="160" rx="14" fill="#eaf3fb" stroke="#1769aa" stroke-width="2.5"/><text x="1945" y="288" font-size="20" font-weight="700" fill="#14263d" text-anchor="middle">Safety Watchdog</text><text x="1945" y="314" font-size="14" font-weight="400" fill="#52657d" text-anchor="middle">systemd supervised</text><text x="1945" y="344" font-size="16" font-weight="400" fill="#14263d" text-anchor="middle">Inhibits proposals and requests</text><text x="1945" y="366" font-size="16" font-weight="400" fill="#14263d" text-anchor="middle">guarded recovery.</text><rect x="330" y="760" width="390" height="160" rx="14" fill="#eaf3fb" stroke="#1769aa" stroke-width="2.5"/><text x="525" y="798" font-size="20" font-weight="700" fill="#14263d" text-anchor="middle">Telemetry Collector</text><text x="525" y="824" font-size="14" font-weight="400" fill="#52657d" text-anchor="middle">psutil · procfs · PSI · optional eBPF</text><text x="525" y="854" font-size="16" font-weight="400" fill="#14263d" text-anchor="middle">Read-only CPU, RAM, I/O, and</text><text x="525" y="876" font-size="16" font-weight="400" fill="#14263d" text-anchor="middle">pressure observations.</text><path d="M810 780 C810 754 1200 754 1200 780 L1200 900 C1200 926 810 926 810 900 Z" fill="#e7f5f2" stroke="#087f73" stroke-width="2.5"/><ellipse cx="1005" cy="780" rx="195" ry="20" fill="#e7f5f2" stroke="#087f73" stroke-width="2.5"/><text x="1005" y="798" font-size="20" font-weight="700" fill="#14263d" text-anchor="middle">Telemetry &amp; Read-Projection Store</text><text x="1005" y="824" font-size="14" font-weight="400" fill="#52657d" text-anchor="middle">SQLite · bounded local data</text><text x="1005" y="854" font-size="16" font-weight="400" fill="#14263d" text-anchor="middle">Accepted samples and safe</text><text x="1005" y="876" font-size="16" font-weight="400" fill="#14263d" text-anchor="middle">read-only projections.</text><rect x="1290" y="760" width="390" height="160" rx="14" fill="#eaf3fb" stroke="#1769aa" stroke-width="2.5"/><text x="1485" y="798" font-size="20" font-weight="700" fill="#14263d" text-anchor="middle">Resource Manager / Actuator</text><text x="1485" y="824" font-size="14" font-weight="400" fill="#52657d" text-anchor="middle">Unix socket · SO_PEERCRED</text><text x="1485" y="854" font-size="16" font-weight="400" fill="#14263d" text-anchor="middle">Only proposed host writer;</text><text x="1485" y="876" font-size="16" font-weight="400" fill="#14263d" text-anchor="middle">read-back verified.</text><path d="M1770 780 C1770 754 2120 754 2120 780 L2120 900 C2120 926 1770 926 1770 900 Z" fill="#e7f5f2" stroke="#087f73" stroke-width="2.5"/><ellipse cx="1945" cy="780" rx="175" ry="20" fill="#e7f5f2" stroke="#087f73" stroke-width="2.5"/><text x="1945" y="798" font-size="20" font-weight="700" fill="#14263d" text-anchor="middle">Audit Store</text><text x="1945" y="824" font-size="14" font-weight="400" fill="#52657d" text-anchor="middle">Separate append-only SQLite</text><text x="1945" y="854" font-size="16" font-weight="400" fill="#14263d" text-anchor="middle">Decision, action, denial, and</text><text x="1945" y="876" font-size="16" font-weight="400" fill="#14263d" text-anchor="middle">recovery evidence.</text><rect x="2300" y="505" width="350" height="230" rx="14" fill="#eef2f6" stroke="#64748b" stroke-width="2.5"/><text x="2475" y="543" font-size="20" font-weight="700" fill="#14263d" text-anchor="middle">Ubuntu 24.04 Linux host</text><text x="2475" y="569" font-size="14" font-weight="400" fill="#52657d" text-anchor="middle">External system · procfs / PSI</text><text x="2475" y="599" font-size="16" font-weight="400" fill="#14263d" text-anchor="middle">Reads selected workload state;</text><text x="2475" y="621" font-size="16" font-weight="400" fill="#14263d" text-anchor="middle">accepts guarded cgroup v2</text><text x="2475" y="643" font-size="16" font-weight="400" fill="#14263d" text-anchor="middle">CPU, RAM, and supported I/O.</text><rect x="106.70000000000002" y="469" width="296.59999999999997" height="28" rx="7" fill="#fff" opacity=".97"/><text x="255" y="490" font-size="14" font-weight="700" fill="#14263d" text-anchor="middle">read-only status · local HTTP GET</text><rect x="1162.3" y="479" width="165.39999999999998" height="28" rx="7" fill="#fff" opacity=".97"/><text x="1245" y="500" font-size="14" font-weight="700" fill="#14263d" text-anchor="middle">prediction result</text><rect x="1680.4" y="564" width="239.2" height="28" rx="7" fill="#fff" opacity=".97"/><text x="1800" y="585" font-size="14" font-weight="700" fill="#14263d" text-anchor="middle">authenticated gated action</text><rect x="1576.7" y="479" width="296.59999999999997" height="28" rx="7" fill="#fff" opacity=".97"/><text x="1725" y="500" font-size="14" font-weight="700" fill="#14263d" text-anchor="middle">health inhibit / recovery trigger</text><rect x="653.6" y="949" width="222.79999999999998" height="28" rx="7" fill="#fff" opacity=".97"/><text x="765" y="970" font-size="14" font-weight="700" fill="#14263d" text-anchor="middle">persist accepted samples</text><rect x="987.5" y="559" width="195" height="28" rx="7" fill="#fff" opacity=".97"/><text x="1085" y="580" font-size="14" font-weight="700" fill="#14263d" text-anchor="middle">read evidence window</text><rect x="1576.7" y="949" width="296.59999999999997" height="28" rx="7" fill="#fff" opacity=".97"/><text x="1725" y="970" font-size="14" font-weight="700" fill="#14263d" text-anchor="middle">append decision / action evidence</text><rect x="1841.7" y="491" width="296.59999999999997" height="28" rx="7" fill="#fff" opacity=".97"/><text x="1990" y="512" font-size="14" font-weight="700" fill="#14263d" text-anchor="middle">apply bounded limits · cgroups v2</text><rect x="1490.7" y="1196" width="378.59999999999997" height="28" rx="7" fill="#fff" opacity=".97"/><text x="1680" y="1217" font-size="14" font-weight="700" fill="#14263d" text-anchor="middle">read selected host telemetry · procfs / PSI</text><rect x="609.4" y="569" width="321.2" height="28" rx="7" fill="#fff" opacity=".97"/><text x="770" y="590" font-size="14" font-weight="700" fill="#14263d" text-anchor="middle">dashboard reads telemetry projection</text><rect x="1614.9" y="579" width="280.2" height="28" rx="7" fill="#fff" opacity=".97"/><text x="1755" y="600" font-size="14" font-weight="700" fill="#14263d" text-anchor="middle">append policy decision evidence</text><rect x="1211.2" y="1276" width="337.59999999999997" height="28" rx="7" fill="#fff" opacity=".97"/><text x="1380" y="1297" font-size="14" font-weight="700" fill="#14263d" text-anchor="middle">dashboard reads separate audit summary</text></svg>