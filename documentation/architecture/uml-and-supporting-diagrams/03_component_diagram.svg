th="2.5" stroke-dasharray="9 7" marker-end="url(#arr)"/><path d="M1680 370 L1735 370 L1735 620 L1770 620 L1770 760" fill="none" stroke="#5e7895" stroke-width="2.5" stroke-dasharray="9 7" marker-end="url(#arr)"/><text x="280" y="190" font-size="17" font-weight="700" fill="#1769aa" text-anchor="start">AIOS application component boundary</text><circle cx="88" cy="520" r="18" fill="#f0f7ec" stroke="#087f73" stroke-width="2.5"/><path d="M88 538v35m-28 22q28-38 56 0m-28-22-20 36m20-36 20 36" fill="none" stroke="#087f73" stroke-width="2.7" stroke-linecap="round"/><rect x="28" y="605" width="120" height="82" rx="12" fill="#eaf3fb" stroke="#1769aa" stroke-width="2"/><text x="88" y="638" font-size="15" font-weight="700" fill="#14263d" text-anchor="middle">Sysadmin / SRE</text><text x="88" y="663" font-size="13" font-weight="400" fill="#52657d" text-anchor="middle">Read-only viewer</text><rect x="330" y="250" width="390" height="160" rx="14" fill="#eaf3fb" stroke="#1769aa" stroke-width="2.5"/><path d="M344 265h24v10h-24z M344 281h24v10h-24z" fill="#fff" stroke="#1769aa" stroke-width="2"/><text x="525" y="300" font-size="20" font-weight="700" fill="#14263d" text-anchor="middle">Read-only Dashboard API</text><text x="525" y="326" font-size="14" font-weight="400" fill="#52657d" text-anchor="middle">&lt;&lt;component&gt;&gt;</text><text x="525" y="356" font-size="16" font-weight="400" fill="#14263d" text-anchor="middle">Reads safe operational and audit</text><text x="525" y="378" font-size="16" font-weight="400" fill="#14263d" text-anchor="middle">projections only.</text><rect x="810" y="250" width="390" height="160" rx="14" fill="#eaf3fb" stroke="#1769aa" stroke-width="2.5"/><path d="M824 265h24v10h-24z M824 281h24v10h-24z" fill="#fff" stroke="#1769aa" stroke-width="2"/><text x="1005" y="300" font-size="20" font-weight="700" fill="#14263d" text-anchor="middle">AI Inference Service</text><text x="1005" y="326" font-size="14" font-weight="400" fill="#52657d" text-anchor="middle">&lt;&lt;component&gt;&gt;</text><text x="1005" y="356" font-size="16" font-weight="400" fill="#14263d" text-anchor="middle">Consumes bounded evidence;</text><text x="1005" y="378" font-size="16" font-weight="400" fill="#14263d" text-anchor="middle">returns prediction.</text><rect x="1290" y="250" width="390" height="160" rx="14" fill="#eaf3fb" stroke="#1769aa" stroke-width="2.5"/><path d="M1304 265h24v10h-24z M1304 281h24v10h-24z" fill="#fff" stroke="#1769aa" stroke-width="2"/><text x="1485" y="300" font-size="20" font-weight="700" fill="#14263d" text-anchor="middle">Decision &amp; Policy Service</text><text x="1485" y="326" font-size="14" font-weight="400" fill="#52657d" text-anchor="middle">&lt;&lt;component&gt;&gt;</text><text x="1485" y="356" font-size="16" font-weight="400" fill="#14263d" text-anchor="middle">Builds per-process decisions;</text><text x="1485" y="378" font-size="16" font-weight="400" fill="#14263d" text-anchor="middle">enforces independent resource gates.</text><rect x="1770" y="250" width="350" height="160" rx="14" fill="#eaf3fb" stroke="#1769aa" stroke-width="2.5"/><path d="M1784 265h24v10h-24z M1784 281h24v10h-24z" fill="#fff" stroke="#1769aa" stroke-width="2"/><text x="1945" y="300" font-size="20" font-weight="700" fill="#14263d" text-anchor="middle">Safety Watchdog</text><text x="1945" y="326" font-size="14" font-weight="400" fill="#52657d" text-anchor="middle">&lt;&lt;component&gt;&gt;</text><text x="1945" y="356" font-size="16" font-weight="400" fill="#14263d" text-anchor="middle">Monitors freshness; inhibits</text><text x="1945" y="378" font-size="16" font-weight="400" fill="#14263d" text-anchor="middle">and requests recovery.</text><rect x="330" y="760" width="390" height="160" rx="14" fill="#eaf3fb" stroke="#1769aa" stroke-width="2.5"/><path d="M344 775h24v10h-24z M344 791h24v10h-24z" fill="#fff" stroke="#1769aa" stroke-width="2"/><text x="525" y="810" font-size="20" font-weight="700" fill="#14263d" text-anchor="middle">Telemetry Collector</text><text x="525" y="836" font-size="14" font-weight="400" fill="#52657d" text-anchor="middle">&lt;&lt;component&gt;&gt;</text><text x="525" y="866" font-size="16" font-weight="400" fill="#14263d" text-anchor="middle">Collects CPU, RAM, I/O, and PSI</text><text x="525" y="888" font-size="16" font-weight="400" fill="#14263d" text-anchor="middle">read-only observations.</text><path d="M810 780 C810 754 1200 754 1200 780 L1200 900 C1200 926 810 926 810 900 Z" fill="#e7f5f2" stroke="#087f73" stroke-width="2.5"/><ellipse cx="1005" cy="780" rx="195" ry="20" fill="#e7f5f2" stroke="#087f73" stroke-width="2.5"/><text x="1005" y="798" font-size="20" font-weight="700" fill="#14263d" text-anchor="middle">Telemetry Store</text><text x="1005" y="824" font-size="14" font-weight="400" fill="#52657d" text-anchor="middle">&lt;&lt;database component&gt;&gt;</text><text x="1005" y="854" font-size="16" font-weight="400" fill="#14263d" text-anchor="middle">Accepted samples and projections.</text><rect x="1290" y="760" width="390" height="160" rx="14" fill="#eaf3fb" stroke="#1769aa" stroke-width="2.5"/><path d="M1304 775h24v10h-24z M1304 791h24v10h-24z" fill="#fff" stroke="#1769aa" stroke-width="2"/><text x="1485" y="810" font-size="20" font-weight="700" fill="#14263d" text-anchor="middle">Resource Manager / Actuator</text><text x="1485" y="836" font-size="14" font-weight="400" fill="#52657d" text-anchor="middle">&lt;&lt;component&gt;&gt;</text><text x="1485" y="866" font-size="16" font-weight="400" fill="#14263d" text-anchor="middle">Validates, applies, reads back,</text><text x="1485" y="888" font-size="16" font-weight="400" fill="#14263d" text-anchor="middle">and audits bounded writes.</text><path d="M1770 780 C1770 754 2120 754 2120 780 L2120 900 C2120 926 1770 926 1770 900 Z" fill="#e7f5f2" stroke="#087f73" stroke-width="2.5"/><ellipse cx="1945" cy="780" rx="175" ry="20" fill="#e7f5f2" stroke="#087f73" stroke-width="2.5"/><text x="1945" y="798" font-size="20" font-weight="700" f