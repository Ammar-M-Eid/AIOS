<svg xmlns="http://www.w3.org/2000/svg" width="2600px" height="1320px" viewBox="0 0 2600 1320"><rect width="2600" height="1320" fill="#fff"/><style>text{font-family:Arial,Helvetica,sans-serif;fill:#14263d} .title{font-size:32px;font-weight:700}.subtitle{font-size:18px;fill:#52657d} .layer{font-size:16px;font-weight:700;fill:#1769aa} .small{font-size:13px;fill:#52657d}</style><text class="title" x="48" y="48">C4 Component Diagram — Safety Watchdog</text><text class="subtitle" x="50" y="76">Scope: one C4 container · proposed design · supporting systems are outside the container boundary.</text><rect x="520" y="135" width="1580" height="1010" rx="16" fill="#f4f8fc" stroke="#1769aa" stroke-width="2"/><text class="" x="545" y="168" text-anchor="start" font-size="19" fill="#1769aa" font-weight="700"><tspan x="545" dy="0">Safety Watchdog — C4 container boundary</tspan></text><g class="entity" data-component="Health &amp; Freshness Monitor"><rect x="590" y="205" width="650" height="205" rx="10" fill="#fff" stroke="#1769aa" stroke-width="2"/><rect x="583" y="213" width="14" height="8" rx="1" fill="#fff" stroke="#1769aa" stroke-width="1.5"/><rect x="583" y="227" width="14" height="8" rx="1" fill="#fff" stroke="#1769aa" stroke-width="1.5"/><text class="" x="612" y="237" text-anchor="start" font-size="20" fill="#14263d" font-weight="700"><tspan x="612" dy="0">Health &amp; Freshness Monitor</tspan></text><text class="" x="612" y="262" text-anchor="start" font-size="14" fill="#52657d" font-weight="400" font-style="italic"><tspan x="612" dy="0">[Component: Timers · systemd state · timestamps]</tspan></text><text class="" x="612" y="294" text-anchor="start" font-size="16" fill="#14263d" font-weight="400"><tspan x="612" dy="0">Monitors service state and telemetry freshness before recovery or inhibition.</tspan></text></g><g class="entity" data-component="Safety State Evaluator"><rect x="1380" y="205" width="650" height="205" rx="10" fill="#fff" stroke="#1769aa" stroke-width="2"/><re