<svg xmlns="http://www.w3.org/2000/svg" width="2600px" height="1500px" viewBox="0 0 2600 1500"><rect width="2600" height="1500" fill="#fff"/><style>text{font-family:Arial,Helvetica,sans-serif;fill:#14263d} .title{font-size:32px;font-weight:700}.subtitle{font-size:18px;fill:#52657d} .layer{font-size:16px;font-weight:700;fill:#1769aa} .small{font-size:13px;fill:#52657d}</style><text class="title" x="48" y="48">C4 Component Diagram — Safety Watchdog</text><text class="subtitle" x="50" y="76">Scope: one C4 container · proposed design · supporting systems are outside the container boundary.</text><rect x="570" y="140" width="1610" height="1240" rx="16" fill="#f4f8fc" stroke="#1769aa" stroke-width="2"/><text class="" x="595" y="173" text-anchor="start" font-size="19" fill="#1769aa" font-weight="700"><tspan x="595" dy="0">Safety Watchdog — C4 container boundary</tspan></text><g class="entity" data-component="Health &amp; Freshness Monitor"><rect x="640" y="220" width="540" height="220" rx="10" fill="#fff" stroke="#1769aa" stroke-width="2"/><rect x="633" y="228" width="14" height="8" rx="1" fill="#fff" stroke="#1769aa" stroke-width="1.5"/><rect x="633" y="242" width="14" height="8" rx="1" fill="#fff" stroke="#1769aa" stroke-width="1.5"/><text class="" x="662" y="252" text-anchor="start" font-size="20" fill="#14263d" font-weight="700"><tspan x="662" dy="0">Health &amp; Freshness Monitor</tspan></text><text class="" x="662" y="277" text-anchor="start" font-size="14" fill="#52657d" font-weight="400" font-style="italic"><tspan x="662" dy="0">[Component: Timers · systemd state · timestamps]</tspan></text><text class="" x="662" y="309" text-anchor="start" font-size="16" fill="#14263d" font-weight="400"><tspan x="662" dy="0">Monitors service state and telemetry freshness before</tspan><tspan x="662" dy="20">recovery or inhibition.</tspan></text></g><g class="entity" data-component="Safety State Evaluator"><rect x="1450" y="220" width="540" height="220" rx="10" fill="#fff" stroke="#1769aa" stroke-width="2"/><rect x="1443" y="228" width="14" height="8" rx="1" fill="#fff" stroke="#1769aa" stroke-width="1.5"/><rect x="1443" y="242" width="14" height="8" rx="1" fill="#fff" stroke="#1769aa" stroke-width="1.5"/><text class="" x="1472" y="252" text-anchor="start" font-size="20" fill="#14263d" font-weight="700"><tspan x="1472" dy="0">Safety State Evaluator</tspan></text><text class="" x="1472" y="277" text-anchor="start" font-size="14" fill="#52657d" font-weight="400" font-style="italic"><tspan x="1472" dy="0">[Component: Explicit state rules]</tspan></text><text class="" x="1472" y="309" text-anchor="start" font-size="16" fill="#14263d" font-weight="400"><tspan x="1472" dy="0">Evaluates safe, degraded, inhibited, and recovery</tspan><tspan x="1472" dy="20">states.</tspan></text></g><g class="entity" data-component="Proposal Inhibit Client"><rect x="640" y="610" width="540" height="220" rx="10" fill="#fff" stroke="#1769aa" stroke-width="2"/><rect x="633" y="618" width="14" height="8" rx="1" fill="#fff" stroke="#1769aa" stroke-width="1.5"/><rect x="633" y="632" width="14" height="8" rx="1" fill="#fff" stroke="#1769aa" stroke-width="1.5"/><text class="" x="662" y="642" text-anchor="start" font-size="20" fill="#14263d" font-weight="700"><tspan x="662" dy="0">Proposal Inhibit Client</tspan></text><text class="" x="662" y="667" text-anchor="start" font-size="14" fill="#52657d" font-weight="400" font-style="italic"><tspan x="662" dy="0">[Component: Policy boundary · contract TBD]</tspan></text><text class="" x="662" y="699" text-anchor="start" font-size="16" fill="#14263d" font-weight="400"><tspan x="662" dy="0">Requests that policy stop new writes while health is</tspan><tspan x="662" dy="20">unsafe or stale.</tspan></text></g><g class="entity" data-component="Guarded Recovery Client"><rect x="1450" y="610" width="540" height="220" rx="10" fill="#fff" stroke="#1769aa" stroke-width="2"/><rect x="1443" y="618" width="14" height="8" rx="1" fill="#fff" stroke="#1769aa" stroke-width="1.5"/><rect x="1443" y="632" width="14" height="8" rx="1" fill="#fff" stroke="#1769aa" stroke-width="1.5"/><text class="" x="1472" y="642" text-anchor="start" font-size="20" fill="#14263d" font-weight="700"><tspan x="1472" dy="0">Guarded Recovery Client</tspan></text><text class="" x="1472" y="667" text-anchor="start" font-size="14" fill="#52657d" font-weight="400" font-style="italic"><tspan x="1472" dy="0">[Component: Unix domain socket]</tspan></text><text class="" x="1472" y="699" text-anchor="start" font-size="16" fill="#14263d" font-weight="400"><tspan x="1472" dy="0">Requests recovery through the same authenticated</tspan><tspan x="1472" dy="20">actuator gates.</tspan></text></g><g class="entity" data-component="Watchdog Event Publisher"><rect x="640" y="1000" width="540" height="220" rx="10" fill="#fff" stroke="#1769aa" stroke-width="2"/><rect x="633" y="1008" width="14" height="8" rx="1" fill="#fff" stroke="#1769aa" stroke-width="1.5"/><rect x="633" y="1022" width="14" height="8" rx="1" fill="#fff" stroke="#1769aa" stroke-width="1.5"/><text class="" x="662" y="1032" text-anchor="start" font-size="20" fill="#14263d" font-weight="700"><tspan x="662" dy="0">Watchdog Event Publisher</tspan></text><text class="" x="662" y="1057" text-anchor="start" font-size="14" fill="#52657d" font-weight="400" font-style="italic"><tspan x="662" dy="0">[Component: Audit store client]</tspan></text><text class="" x="662" y="1089" text-anchor="start" font-size="16" fill="#14263d" font-weight="400"><tspan x="662" dy="0">Records state transitions, inhibition, and recovery</tspan><tspan x="662" dy="20">outcomes.</tspan></text></g><g class="external-endpoint" data-endpoint="Decision &amp; Policy Service"><rect x="15" y="661" width="350" height="118" rx="9" fill="#eef2f6" stroke="#64748b" stroke-width="1.4"/><text class="" x="190" y="683" text-anchor="middle" font-size="11" fill="#14263d" font-weight="700"><tspan x="190" dy="0">Decision &amp; Policy Service</ts