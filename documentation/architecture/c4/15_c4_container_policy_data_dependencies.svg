<svg xmlns="http://www.w3.org/2000/svg" width="2300px" height="1150px" viewBox="0 0 2300 1150"><rect width="2300" height="1150" fill="#fff"/><style>text{font-family:Arial,Helvetica,sans-serif;fill:#14263d} .title{font-size:32px;font-weight:700}.subtitle{font-size:18px;fill:#52657d} .layer{font-size:16px;font-weight:700;fill:#1769aa} .small{font-size:13px;fill:#52657d}</style><text class="title" x="48" y="48">C4 Container Diagram — Policy and Telemetry Dependencies</text><text class="subtitle" x="50" y="76">Focused view of fresh telemetry context and read-model dependencies.</text><rect x="300" y="112" width="1750" height="880" rx="16" fill="#fff" stroke="#1769aa" stroke-width="2.2"/><text class="" x="324" y="141" text-anchor="start" font-size="17" fill="#1769aa" font-weight="700"><tspan x="324" dy="0">AIOS software system boundary</tspan></text><path d="M 950 180 L 1480 180 L 1480 440 L 1476 445 L 1500 445" fill="none" stroke="#64748b" stroke-width="1.8" stroke-dasharray="7 5" stroke-linecap="round" stroke-linejoin="round" /><path d="M 1491 449 L 1500 445 L 1491 441" fill="none" stroke="#64748b" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><rect x="1048.5" y="309" width="323" height="42" rx="3" fill="#fff" stroke="none" stroke-width="0"/><text class="" x="1210" y="325" text-anchor="middle" font-size="14" fill="#14263d" font-weight="700"><tspan x="1210" dy="0">reads process context · ITelemetryContext</tspan><tspan x="1210" dy="16">SQLite</tspan></text><path d="M 950 190 L 974 190 L 980 200 L 1480 200 L 1480 460 L 1476 455 L 1500 455" fill="none" stroke="#64748b" stroke-width="1.8" stroke-dasharray="7 5" stroke-linecap="round" stroke-linejoin="round" /><path d="M 1491 459 L 1500 455 L 1491 451" fill="none" stroke="#64748b" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><rect x="1034" y="364" width="352" height="42" rx="3" fill="#fff" stroke="none" stroke-width="0"/><text class="" x="1210" y="380" text-anchor="middle" font-size="14" fill="#14263d" font-weight="700"><tspan x="1210" dy="0">writes read model · ITelemetryProjectionWrite</tspan><tspan x="1210" dy="16">SQLite</tspan></text><path d="M 950 790 L 974 790 L 980 800 L 1480 800 L 1480 460 L 1476 465 L 1500 465" fill="none" stroke="#64748b" stroke-width="1.8" stroke-dasharray="7 5" stroke-linecap="round" stroke-linejoin="round" /><path d="M 1491 469 L 1500 465 L 1491 461" fill="none" stroke="#64748b" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><rect x="1052" y="629" width="316" height="42" rx="3" fill="#fff" stroke="none" stroke-width="0"/><text class="" x="1210" y="645" text-anchor="middle" font-size="14" fill="#14263d" font-weight="700"><tspan x="1210" dy="0">checks freshness · IObservationFreshness</tspan><tspan x="1210" dy="16">local store read</tspan></text><rect x="350" y="160" width="600" height="140" rx="12" fill="#eaf3fb" stroke="#2f80c9" stroke-width="1.6"/><text class="" x="650" y="188" text-anchor="middle" font-size="18" fill="#14263d" font-weight="700"><tspan x="650" dy="0">Decision &amp; Policy Service</tspan></text><text class="" x="650" y="211" text-anchor="middle" font-size="12" fill="#52657d" font-weight="400" font-style="italic"><tspan x="650" dy="0">Container · Proposed Python service</tspan></text><text class="" x="650" y="246" text-anchor="middle" font-size="16" fill="#14263d" font-weight="400"><tspan x="650" dy="0">Builds per-process decisions; applies OBSERVE_ONLY defaults and</tspan><tspan x="650" dy="20">independent resource gates.</tspan></text><rect x="350" y="750" width="600" height="140" rx="12" fill="#eaf3fb" stroke="#2f80c9" stroke-width="1.6"/><text class="" x="650" y="778" text-anchor="middle" font-size="18" fill="#14263d" font-weight="700"><tspan x="650" dy="0">Safety Watchdog</tspan></text><text class="" x="650" y="801" text-anchor="middle" font-size="12" fill="#52657d" font-weight="400" font-style="italic"><tspan x="650" dy="0">Container · Proposed Python service · systemd supervised</tspan></text><text class="" x="650" y="836" text-anchor="middle" font-size="16" fill="#14263d" font-weight="400"><tspan x="650" dy="0">Monitors health and freshness; inhibits writes and requests</tspan><tspan x="650" dy="20">guarded recovery.</tspan></text><path d="M 1500 439 C 1500 420 2000 420 2000 439 L 2000 551 C 2000 570 1500 570 1500 551 Z" fill="#e7f5f2" stroke="#087f73" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" /><ellipse cx="1750" cy="439" rx="250" ry="19" fill="#e7f5f2" stroke="#087f73" stroke-width="1.7"/><text class="" x="1750" y="478" text-anchor="middle" font-size="18" fill="#14263d" font-weight="700"><tspan x="1750" dy="0">Telemetry &amp; Read-Projection Store</tspan></text><text class="" x="1750" y="498" text-anchor="middle" font-size="12" fill="#52657d" font-weight="400" font-style="italic"><tspan x="1750" dy="0">Container · database · SQLite · local database container</tspan></text><text class="" x="1750" y="521" text-anchor="middle" font-size="15" fill="#14263d" font-weight="400"><tspan x="1750" dy="0">Bounded samples, freshness metadata, and</tspan><tspan x="1750" dy="18">read-only projections.</tspan></text><text class="" x="320" y="1015" text-anchor="start" font-size="14" fill="#52657d" font-weight="400"><tspan x="320" dy="0">Key: blue = application container; teal cylinders = separate SQLite databases; green = person; grey = external system. Dashed arrows point from caller to provider; labels name the relationship, interface, and technology.</tspan></text><text class="" x="320" y="1047" text-anchor="start" font-size="14" fill="#52657d" font-weight="400"><tspan x="320" dy="0">Focused C4 container detail: the diagram shows the selected dependencies. The main container view provides system context.</tspan></text></svg>