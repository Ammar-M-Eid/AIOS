<svg xmlns="http://www.w3.org/2000/svg" width="2800px" height="1020px" viewBox="0 0 2800 1020"><rect width="2800" height="1020" fill="#fff"/><style>text{font-family:Arial,Helvetica,sans-serif;fill:#14263d} .title{font-size:32px;font-weight:700}.subtitle{font-size:18px;fill:#52657d} .layer{font-size:16px;font-weight:700;fill:#1769aa} .small{font-size:13px;fill:#52657d}</style><text class="title" x="48" y="48">C4 Container Diagram — Audit Dependencies</text><text class="subtitle" x="50" y="76">Focused view of audit writes and read-only audit projections.</text><rect x="340" y="112" width="2100" height="680" rx="16" fill="#fff" stroke="#1769aa" stroke-width="2.2"/><text class="" x="364" y="141" text-anchor="start" font-size="17" fill="#1769aa" font-weight="700"><tspan x="364" dy="0">AIOS software system boundary</tspan></text><path d="M 1010 185 L 1034 185 L 1040 180 L 1040 340 L 1860 340 L 1856 337.5 L 1880 337.5" fill="none" stroke="#64748b" stroke-width="1.8" stroke-dasharray="7 5" stroke-linecap="round" stroke-linejoin="round" /><path d="M 1871 341.5 L 1880 337.5 L 1871 333.5" fill="none" stroke="#64748b" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><text class="" x="1450" y="374" text-anchor="middle" font-size="14" fill="#14263d" font-weight="700"><tspan x="1450" dy="0">reads audit projection from</tspan><tspan x="1450" dy="17">IAuditRead</tspan></text><path d="M 1010 495 L 1034 495 L 1040 500 L 1040 340 L 1860 340 L 1856 347.5 L 1880 347.5" fill="none" stroke="#64748b" stroke-width="1.8" stroke-dasharray="7 5" stroke-linecap="round" stroke-linejoin="round" /><path d="M 1871 351.5 L 1880 347.5 L 1871 343.5" fill="none" stroke="#64748b" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><text class="" x="923" y="415" text-anchor="middle" font-size="14" fill="#14263d" font-weight="700"><tspan x="923" dy="0">appends audit record to</tspan><tspan x="923" dy="17">IAuditStoreWrite</tspan></text><path d="M 1730 205 L 1754 205 L 1760 200 L 1760 360 L 1860 360 L 1856 357.5 L 1880 357.5" fill="none" stroke="#64748b" stroke-width="1.8" stroke-dasharray="7 5" stroke-linecap="round" stroke-linejoin="round" /><path d="M 1871 361.5 L 1880 357.5 L 1871 353.5" fill="none" stroke="#64748b" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><text class="" x="1874" y="197.5" text-anchor="middle" font-size="14" fill="#14263d" font-weight="700"><tspan x="1874" dy="0">appends audit record to</tspan><tspan x="1874" dy="17">IAuditStoreWrite</tspan></text><path d="M 1730 515 L 1754 515 L 1760 520 L 1760 360 L 1860 360 L 1856 367.5 L 1880 367.5" fill="none" stroke="#64748b" stroke-width="1.8" stroke-dasharray="7 5" stroke-linecap="round" stroke-linejoin="round" /><path d="M 1871 371.5 L 1880 367.5 L 1871 363.5" fill="none" stroke="#64748b" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><text class="" x="1741" y="358.75" text-anchor="middle" font-size="14" fill="#14263d" font-weight="700"><tspan x="1741" dy="0">appends audit record to</tspan><tspan x="1741" dy="17">IAuditStoreWrite</tspan></text><rect x="440" y="165" width="570" height="140" rx="12" fill="#eaf3fb" stroke="#2f80c9" stroke-width="1.6"/><text class="" x="725" y="193" text-anchor="middle" font-size="18" fill="#14263d" font-weight="700"><tspan x="725" dy="0">Read-only Dashboard API</tspan></text><text class="" x="725" y="216" text-anchor="middle" font-size="12" fill="#52657d" font-weight="400" font-style="italic"><tspan x="725" dy="0">Container · Python · FastAPI</tspan></text><text class="" x="725" y="251" text-anchor="middle" font-size="16" fill="#14263d" font-weight="400"><tspan x="725" dy="0">Serves status, recommendation, health, and audit</tspan><tspan x="725" dy="20">projections. Human access is read-only.</tspan></text><rect x="440" y="465" width="570" height="140" rx="12" fill="#eaf3fb" stroke="#2f80c9" stroke-width="1.6"/><text class="" x="725" y="493" text-anchor="middle" font-size="18" fill="#14263d" font-weight="700"><tspan x="725" dy="0">Decision &amp; Policy Service</tspan></text><text class="" x="725" y="516" text-anchor="middle" font-size="12" fill="#52657d" font-weight="400" font-style="italic"><tspan x="725" dy="0">Container · Proposed Python service</tspan></text><text class="" x="725" y="551" text-anchor="middle" font-size="16" fill="#14263d" font-weight="400"><tspan x="725" dy="0">Builds per-process decisions; applies OBSERVE_ONLY defaults</tspan><tspan x="725" dy="20">and independent resource gates.</tspan></text><rect x="1160" y="165" width="570" height="140" rx="12" fill="#eaf3fb" stroke="#2f80c9" stroke-width="1.6"/><text class="" x="1445" y="193" text-anchor="middle" font-size="18" fill="#14263d" font-weight="700"><tspan x="1445" dy="0">Safety Watchdog</tspan></text><text class="" x="1445" y="216" text-anchor="middle" font-size="12" fill="#52657d" font-weight="400" font-style="italic"><tspan x="1445" dy="0">Container · Proposed Python service · systemd supervised</tspan></text><text class="" x="1445" y="251" text-anchor="middle" font-size="16" fill="#14263d" font-weight="400"><tspan x="1445" dy="0">Monitors health and freshness; inhibits writes and requests</tspan><tspan x="1445" dy="20">guarded recovery.</tspan></text><rect x="1160" y="465" width="570" height="140" rx="12" fill="#eaf3fb" stroke="#2f80c9" stroke-width="1.6"/><text class="" x="1445" y="493" text-anchor="middle" font-size="18" fill="#14263d" font-weight="700"><tspan x="1445" dy="0">Resource Manager / Actuator</tspan></text><text class="" x="1445" y="516" text-anchor="middle" font-size="12" fill="#52657d" font-weight="400" font-style="italic"><tspan x="1445" dy="0">Container · Python · Unix socket · SO_PEERCRED · cgroups v2</tspan></text><text class="" x="1445" y="551" text-anchor="middle" font-size="16" fill="#14263d" font-weight="400"><tspan x="1445" dy="0">Only proposed host writer; applies separately gated CPU,</tspan><tspan x="1445" dy="20">RAM, and supported I/O limits.</tspan></text><path d="M 1880 334 C 1880 315 2400 315 2400 334 L 2400 441 C 2400 460 1880 460 1880 441 Z" fill="#e7f5f2" stroke="#087f73" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" /><ellipse cx="2140" cy="334" rx="260" ry="19" fill="#e7f5f2" stroke="#087f73" stroke-width="1.7"/><text class="" x="2140" y="373" text-anchor="middle" font-size="18" fill="#14263d" font-weight="700"><tspan x="2140" dy="0">Audit Store</tspan></text><text class="" x="2140" y="393" text-anchor="middle" font-size="12" fill="#52657d" font-weight="400" font-style="italic"><tspan x="2140" dy="0">Container · database · Append-only host-local log · hash chained</tspan></text><text class="" x="2140" y="416" text-anchor="middle" font-size="15" fill="#14263d" font-weight="400"><tspan x="2140" dy="0">Decisions, denials, action evidence,</tspan><tspan x="2140" dy="18">verification, and recovery.</tspan></text><text class="" x="360" y="885" text-anchor="start" font-size="14" fill="#52657d" font-weight="400"><tspan x="360" dy="0">Key: blue = application container; teal cylinders = separate SQLite databases; green = person; grey = external system. Dashed arrows point from caller to provider; labels name the relationship, interface, and technology.</tspan></text><text class="" x="360" y="917" text-anchor="start" font-size="14" fill="#52657d" font-weight="400"><tspan x="360" dy="0">Focused C4 container detail: the diagram shows the selected dependencies. The main container view provides system context.</tspan></text></svg>