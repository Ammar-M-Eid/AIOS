<svg xmlns="http://www.w3.org/2000/svg" width="2200px" height="980px" viewBox="0 0 2200 980"><rect width="2200" height="980" fill="#fff"/><style>text{font-family:Arial,Helvetica,sans-serif;fill:#14263d} .title{font-size:32px;font-weight:700}.subtitle{font-size:18px;fill:#52657d} .layer{font-size:16px;font-weight:700;fill:#1769aa} .small{font-size:13px;fill:#52657d}</style><text class="title" x="48" y="48">C4 System Context Diagram — AIOS</text><text class="subtitle" x="50" y="76">Sysadmins inspect the system; AIOS monitors selected workloads and uses guarded Linux interfaces for supported resource controls.</text><g class="person"><rect x="62" y="415" width="276" height="155" rx="24" fill="#f0f7ec" stroke="#087f73" stroke-width="2"/><path d="M 200 408 V 416" stroke="#087f73" stroke-width="3"/><circle cx="200" cy="388" r="20" fill="#f0f7ec" stroke="#087f73" stroke-width="2"/><text class="" x="200" y="438" text-anchor="middle" font-size="17" fill="#14263d" font-weight="700"><tspan x="200" dy="0">Sysadmin / SRE</tspan></text><text class="" x="200" y="459" text-anchor="middle" font-size="12" fill="#52657d" font-weight="400" font-style="italic"><tspan x="200" dy="0">Person · read-only viewer</tspan></text><text class="" x="200" y="480" text-anchor="middle" font-size="12" fill="#14263d" font-weight="400"><tspan x="200" dy="0">Reviews dashboard projections.</tspan></text></g><rect x="700" y="310" width="500" height="260" rx="12" fill="#eaf3fb" stroke="#2f80c9" stroke-width="1.6"/><text class="" x="950" y="341" text-anchor="middle" font-size="20" fill="#14263d" font-weight="700"><tspan x="950" dy="0">AIOS</tspan></text><text class="" x="950" y="366" text-anchor="middle" font-size="14" fill="#52657d" font-weight="400" font-style="italic"><tspan x="950" dy="0">Software system</tspan></text><text class="" x="950" y="396" text-anchor="middle" font-size="16" fill="#14263d" font-weight="400"><tspan x="950" dy="0">Monitors CPU, RAM, I/O, and pressure.</tspan><tspan x="950" dy="20">Builds per-process decisions and recommendations.</tspan><tspan x="950" dy="20">Applies only policy-gated, verified actions.</tspan></text><rect x="1480" y="220" width="650" height="210" rx="12" fill="#eef2f6" stroke="#64748b" stroke-width="1.6"/><text class="" x="1805" y="251" text-anchor="middle" font-size="20" fill="#14263d" font-weight="700"><tspan x="1805" dy="0">Target workloads</tspan></text><text class="" x="1805" y="276" text-anchor="middle" font-size="14" fill="#52657d" font-weight="400" font-style="italic"><tspan x="1805" dy="0">External software system</tspan></text><text class="" x="1805" y="306" text-anchor="middle" font-size="16" fill="#14263d" font-weight="400"><tspan x="1805" dy="0">Explicitly selected Linux processes and cgroups.</tspan><tspan x="1805" dy="20">Workload state is read before a decision.</tspan></text><rect x="1480" y="570" width="650" height="230" rx="12" fill="#eef2f6" stroke="#64748b" stroke-width="1.6"/><text class="" x="1805" y="601" text-anchor="middle" font-size="20" fill="#14263d" font-weight="700"><tspan x="1805" dy="0">Ubuntu 24.04 Linux host</tspan></text><text class="" x="1805" y="626" text-anchor="middle" font-size="14" fill="#52657d" font-weight="400" font-style="italic"><tspan x="1805" dy="0">External software system</tspan></text><text class="" x="1805" y="656" text-anchor="middle" font-size="16" fill="#14263d" font-weight="400"><tspan x="1805" dy="0">Provides procfs / PSI observations and cgroup v2 controls.</tspan><tspan x="1805" dy="20">Only supported, bounded resource changes are proposed.</tspan></text><path d="M 350 465 L 690.0162866557603 445.57049790538514" fill="none" stroke="#64748b" stroke-width="2" stroke-dasharray="7 6" stroke-linecap="round" stroke-linejoin="round" /><path d="M 690.3015356084528 450.562354577505 L 700 445 L 689.7310377030677 440.5786412332653" fill="none" stroke="#64748b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="400" y="395" width="250" height="24" rx="4" fill="#fff" stroke="none" stroke-width="0"/><text class="" x="525" y="413" text-anchor="middle" font-size="15" fill="#64748b" font-weight="600"><tspan x="525" dy="0">views status · local HTTP GET</tspan></text><path d="M 1200 380 L 1470.2590279975666 317.2612970719935" fill="none" stroke="#64748b" stroke-width="2" stroke-dasharray="7 6" stroke-linecap="round" stroke-linejoin="round" /><path d="M 1471.3896765335633 322.1317830732103 L 1480 315 L 1469.12837946157 312.39081107077675" fill="none" stroke="#64748b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="1185" y="304" width="310" height="24" rx="4" fill="#fff" stroke="none" stroke-width="0"/><text class="" x="1340" y="322" text-anchor="middle" font-size="15" fill="#64748b" font-weight="600"><tspan x="1340" dy="0">reads workload state · procfs / cgroup v2</tspan></text><path d="M 1200 500 L 1471.5882152462345 674.592424086865" fill="none" stroke="#64748b" stroke-width="2" stroke-dasharray="7 6" stroke-linecap="round" stroke-linejoin="round" /><path d="M 1468.884427289667 678.7983164637477 L 1480 680 L 1474.292003202802 670.3865317099823" fill="none" stroke="#64748b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="1225" y="522" width="230" height="24" rx="4" fill="#fff" stroke="none" stroke-width="0"/><text class="" x="1340" y="540" text-anchor="middle" font-size="15" fill="#64748b" font-weight="600"><tspan x="1340" dy="0">requests guarded limits · cgroups v2</tspan></text><path d="M 1805 430 L 1805 560" fill="none" stroke="#64748b" stroke-width="2" stroke-dasharray="7 6" stroke-linecap="round" stroke-linejoin="round" /><path d="M 1800 560 L 1805 570 L 1810 560" fill="none" stroke="#64748b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="1690" y="467" width="230" height="24" rx="4" fill="#fff" stroke="none" stroke-width="0"/><text class="" x="1805" y="485" text-anchor="middle" font-size="15" fill="#64748b" font-weight="600"><tspan x="1805" dy="0">runs on · Ubuntu Linux</tspan></text><rect x="220" y="850" width="1900" height="75" rx="10" fill="#fff6df" stroke="#e7cc83" stroke-width="1"/><text class="" x="1170" y="884" text-anchor="middle" font-size="15" fill="#14263d" font-weight="400"><tspan x="1170" dy="0">Key: green = Person; blue = AIOS software system; grey = external software systems. AIOS is in scope; the person, target workloads, and Ubuntu/Linux host are outside it. Dashed arrows are labeled, one-way relationships (project convention).</tspan></text></svg>