<svg xmlns="http://www.w3.org/2000/svg" width="2500px" height="1010px" viewBox="0 0 2500 1010"><rect width="2500" height="1010" fill="#fff"/><style>text{font-family:Arial,Helvetica,sans-serif;fill:#14263d} .title{font-size:32px;font-weight:700}.subtitle{font-size:18px;fill:#52657d} .layer{font-size:16px;font-weight:700;fill:#1769aa} .small{font-size:13px;fill:#52657d}</style><text class="title" x="48" y="48">C4 Container Diagram — Policy and Watchdog Dependencies</text><text class="subtitle" x="50" y="76">Focused view of verified outcomes, service health, write inhibition, and guarded recovery.</text><rect x="300" y="112" width="1550" height="720" rx="16" fill="#fff" stroke="#1769aa" stroke-width="2.2"/><text class="" x="324" y="141" text-anchor="start" font-size="17" fill="#1769aa" font-weight="700"><tspan x="324" dy="0">AIOS software system boundary</tspan></text><path d="M 635 315 L 635 339 L 640 340 L 640 500 L 720 500 L 716 507.5 L 740 507.5" fill="none" stroke="#64748b" stroke-width="1.8" stroke-dasharray="7 5" stroke-linecap="round" stroke-linejoin="round" /><path d="M 731 511.5 L 740 507.5 L 731 503.5" fill="none" stroke="#64748b" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><text class="" x="700" y="385" text-anchor="middle" font-size="14" fill="#14263d" font-weight="700"><tspan x="700" dy="0">uses the verified outcome contract</tspan><tspan x="700" dy="17">IActionOutcome</tspan></text><path d="M 1710 205 L 1734 205 L 1740 200 L 1740 300 L 1900 300 L 1906 302.5 L 1930 302.5" fill="none" stroke="#64748b" stroke-width="1.8" stroke-dasharray="7 5" stroke-linecap="round" stroke-linejoin="round" /><path d="M 1921 306.5 L 1930 302.5 L 1921 298.5" fill="none" stroke="#64748b" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><text class="" x="1840" y="210" text-anchor="middle" font-size="14" fill="#14263d" font-weight="700"><tspan x="1840" dy="0">checks health through</tspan><tspan x="1840" dy="17">IServiceHealth</tspan></text><path d="M 1120 215 L 1096 215 L 1100 220 L 1000 220 L 1004 215 L 980 215" fill="none" stroke="#64748b" stroke-width="1.8" stroke-dasharray="7 5" stroke-linecap="round" stroke-linejoin="round" /><path d="M 989 211 L 980 215 L 989 219" fill="none" stroke="#64748b" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><text class="" x="1055" y="350" text-anchor="middle" font-size="14" fill="#14263d" font-weight="700"><tspan x="1055" dy="0">requests policy write inhibition through</tspan><tspan x="1055" dy="17">IPolicyInhibit</tspan></text><path d="M 1395 315 L 1395 339 L 1400 340 L 1400 540 L 1380 540 L 1384 537.5 L 1360 537.5" fill="none" stroke="#64748b" stroke-width="1.8" stroke-dasharray="7 5" stroke-linecap="round" stroke-linejoin="round" /><path d="M 1369 533.5 L 1360 537.5 L 1369 541.5" fill="none" stroke="#64748b" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><text class="" x="1535" y="425" text-anchor="middle" font-size="14" fill="#14263d" font-weight="700"><tspan x="1535" dy="0">uses the bounded action-request contract</tspan><tspan x="1535" dy="17">IActionRequest</tspan></text><path d="M 1405 315 L 1405 339 L 1400 340 L 1400 540 L 1380 540 L 1384 547.5 L 1360 547.5" fill="none" stroke="#64748b" stroke-width="1.8" stroke-dasharray="7 5" stroke-linecap="round" stroke-linejoin="round" /><path d="M 1369 543.5 L 1360 547.5 L 1369 551.5" fill="none" stroke="#64748b" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><text class="" x="1570" y="510" text-anchor="middle" font-size="14" fill="#14263d" font-weight="700"><tspan x="1570" dy="0">uses the verified outcome contract</tspan><tspan x="1570" dy="17">IActionOutcome</tspan></text><rect x="390" y="175" width="590" height="140" rx="12" fill="#eaf3fb" stroke="#2f80c9" stroke-width="1.6"/><text class="" x="685" y="203" text-anchor="middle" font-size="18" fill="#14263d" font-weight="700"><tspan x="685" dy="0">Decision &amp; Policy Service</tspan></text><text class="" x="685" y="226" text-anchor="middle" font-size="12" fill="#52657d" font-weight="400" font-style="italic"><tspan x="685" dy="0">Container · Proposed Python service</tspan></text><text class="" x="685" y="261" text-anchor="middle" font-size="16" fill="#14263d" font-weight="400"><tspan x="685" dy="0">Builds per-process decisions; applies OBSERVE_ONLY defaults</tspan><tspan x="685" dy="20">and independent resource gates.</tspan></text><rect x="1120" y="175" width="590" height="140" rx="12" fill="#eaf3fb" stroke="#2f80c9" stroke-width="1.6"/><text class="" x="1415" y="203" text-anchor="middle" font-size="18" fill="#14263d" font-weight="700"><tspan x="1415" dy="0">Safety Watchdog</tspan></text><text class="" x="1415" y="226" text-anchor="middle" font-size="12" fill="#52657d" font-weight="400" font-style="italic"><tspan x="1415" dy="0">Container · Proposed Python service · systemd supervised</tspan></text><text class="" x="1415" y="261" text-anchor="middle" font-size="16" fill="#14263d" font-weight="400"><tspan x="1415" dy="0">Monitors health and freshness; inhibits writes and requests</tspan><tspan x="1415" dy="20">guarded recovery.</tspan></text><rect x="740" y="485" width="620" height="145" rx="12" fill="#eaf3fb" stroke="#2f80c9" stroke-width="1.6"/><text class="" x="1050" y="513" text-anchor="middle" font-size="18" fill="#14263d" font-weight="700"><tspan x="1050" dy="0">Resource Manager / Actuator</tspan></text><text class="" x="1050" y="536" text-anchor="middle" font-size="12" fill="#52657d" font-weight="400" font-style="italic"><tspan x="1050" dy="0">Container · Python · Unix socket · SO_PEERCRED · cgroups v2</tspan></text><text class="" x="1050" y="571" text-anchor="middle" font-size="16" fill="#14263d" font-weight="400"><tspan x="1050" dy="0">Only proposed host writer; applies separately gated CPU, RAM, and</tspan><tspan x="1050" dy="20">supported I/O limits.</tspan></text><rect x="1930" y="270" width="380" height="145" rx="12" fill="#eef2f6" stroke="#64748b" stroke-width="1.6"/><text class="" x="2120" y="298" text-anchor="middle" font-size="18" fill="#14263d" font-weight="700"><tspan x="2120" dy="0">systemd service manager</tspan></text><text class="" x="2120" y="321" text-anchor="middle" font-size="12" fill="#52657d" font-weight="400" font-style="italic"><tspan x="2120" dy="0">External software system · systemd · host supervisor</tspan></text><text class="" x="2120" y="356" text-anchor="middle" font-size="16" fill="#14263d" font-weight="400"><tspan x="2120" dy="0">Reports local service state.</tspan></text><text class="" x="320" y="875" text-anchor="start" font-size="14" fill="#52657d" font-weight="400"><tspan x="320" dy="0">Key: blue = application container; teal cylinders = separate SQLite databases; green = person; grey = external system. Dashed arrows point from caller to provider; labels name the relationship, interface, and technology.</tspan></text><text class="" x="320" y="907" text-anchor="start" font-size="14" fill="#52657d" font-weight="400"><tspan x="320" dy="0">Focused C4 container detail: the diagram shows the selected dependencies. The main container view provides system context.</tspan></text></svg>