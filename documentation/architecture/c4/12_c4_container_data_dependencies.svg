<svg xmlns="http://www.w3.org/2000/svg" width="2300px" height="1000px" viewBox="0 0 2300 1000"><rect width="2300" height="1000" fill="#fff"/><style>text{font-family:Arial,Helvetica,sans-serif;fill:#14263d} .title{font-size:32px;font-weight:700}.subtitle{font-size:18px;fill:#52657d} .layer{font-size:16px;font-weight:700;fill:#1769aa} .small{font-size:13px;fill:#52657d}</style><text class="title" x="48" y="48">C4 Container Diagram — Dashboard Read Dependencies</text><text class="subtitle" x="50" y="76">Focused view of the read-only dashboard and its data-store dependencies.</text><rect x="330" y="112" width="1790" height="680" rx="16" fill="#fff" stroke="#1769aa" stroke-width="2.2"/><text class="" x="354" y="141" text-anchor="start" font-size="17" fill="#1769aa" font-weight="700"><tspan x="354" dy="0">AIOS software system boundary</tspan></text><path d="M 280 345 L 304 345 L 300 340 L 420 340 L 420 320 L 426 322.5 L 450 322.5" fill="none" stroke="#64748b" stroke-width="1.8" stroke-dasharray="7 5" stroke-linecap="round" stroke-linejoin="round" /><path d="M 441 326.5 L 450 322.5 L 441 318.5" fill="none" stroke="#64748b" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><text class="" x="455" y="275" text-anchor="middle" font-size="14" fill="#14263d" font-weight="700"><tspan x="455" dy="0">requests read-only view from</tspan><tspan x="455" dy="17">IDashboardRead</tspan></text><path d="M 1050 332.5 L 1074 332.5 L 1080 340 L 1080 200 L 1450 200" fill="none" stroke="#64748b" stroke-width="1.8" stroke-dasharray="7 5" stroke-linecap="round" stroke-linejoin="round" /><path d="M 1441 204 L 1450 200 L 1441 196" fill="none" stroke="#64748b" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><text class="" x="1240" y="240" text-anchor="middle" font-size="14" fill="#14263d" font-weight="700"><tspan x="1240" dy="0">uses the IReadProjection contract</tspan><tspan x="1240" dy="17">IReadProjection</tspan></text><path d="M 1050 342.5 L 1074 342.5 L 1080 340 L 1080 560 L 1420 560 L 1426 555 L 1450 555" fill="none" stroke="#64748b" stroke-width="1.8" stroke-dasharray="7 5" stroke-linecap="round" stroke-linejoin="round" /><path d="M 1441 559 L 1450 555 L 1441 551" fill="none" stroke="#64748b" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><text class="" x="1240" y="545" text-anchor="middle" font-size="14" fill="#14263d" font-weight="700"><tspan x="1240" dy="0">reads audit projection from</tspan><tspan x="1240" dy="17">IAuditRead</tspan></text><g class="person"><rect x="32" y="385" width="236" height="75" rx="24" fill="#f0f7ec" stroke="#087f73" stroke-width="2"/><path d="M 150 378 V 386" stroke="#087f73" stroke-width="3"/><circle cx="150" cy="358" r="20" fill="#f0f7ec" stroke="#087f73" stroke-width="2"/><text class="" x="150" y="408" text-anchor="middle" font-size="17" fill="#14263d" font-weight="700"><tspan x="150" dy="0">Sysadmin / SRE</tspan></text><text class="" x="150" y="429" text-anchor="middle" font-size="12" fill="#52657d" font-weight="400" font-style="italic"><tspan x="150" dy="0">Person · read-only viewer</tspan></text><text class="" x="150" y="450" text-anchor="middle" font-size="12" fill="#14263d" font-weight="400"><tspan x="150" dy="0">Reviews dashboard projections.</tspan></text></g><rect x="450" y="300" width="600" height="145" rx="12" fill="#eaf3fb" stroke="#2f80c9" stroke-width="1.6"/><text class="" x="750" y="328" text-anchor="middle" font-size="18" fill="#14263d" font-weight="700"><tspan x="750" dy="0">Read-only Dashboard API</tspan></text><text class="" x="750" y="351" text-anchor="middle" font-size="12" fill="#52657d" font-weight="400" font-style="italic"><tspan x="750" dy="0">Container · Python · FastAPI</tspan></text><text class="" x="750" y="386" text-anchor="middle" font-size="16" fill="#14263d" font-weight="400"><tspan x="750" dy="0">Serves status, recommendation, health, and audit projections.</tspan><tspan x="750" dy="20">Human access is read-only.</tspan></text><path d="M 1450 184 C 1450 165 2010 165 2010 184 L 2010 296 C 2010 315 1450 315 1450 296 Z" fill="#e7f5f2" stroke="#087f73" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" /><ellipse cx="1730" cy="184" rx="280" ry="19" fill="#e7f5f2" stroke="#087f73" stroke-width="1.7"/><text class="" x="1730" y="223" text-anchor="middle" font-size="18" fill="#14263d" font-weight="700"><tspan x="1730" dy="0">Telemetry &amp; Read-Projection Store</tspan></text><text class="" x="1730" y="243" text-anchor="middle" font-size="12" fill="#52657d" font-weight="400" font-style="italic"><tspan x="1730" dy="0">Container · database · SQLite · local database container</tspan></text><text class="" x="1730" y="266" text-anchor="middle" font-size="15" fill="#14263d" font-weight="400"><tspan x="1730" dy="0">Bounded samples, freshness metadata, and read-only</tspan><tspan x="1730" dy="18">projections.</tspan></text><path d="M 1450 529 C 1450 510 2010 510 2010 529 L 2010 641 C 2010 660 1450 660 1450 641 Z" fill="#e7f5f2" stroke="#087f73" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" /><ellipse cx="1730" cy="529" rx="280" ry="19" fill="#e7f5f2" stroke="#087f73" stroke-width="1.7"/><text class="" x="1730" y="568" text-anchor="middle" font-size="18" fill="#14263d" font-weight="700"><tspan x="1730" dy="0">Audit Store</tspan></text><text class="" x="1730" y="588" text-anchor="middle" font-size="12" fill="#52657d" font-weight="400" font-style="italic"><tspan x="1730" dy="0">Container · database · Append-only host-local log · hash chained</tspan></text><text class="" x="1730" y="611" text-anchor="middle" font-size="15" fill="#14263d" font-weight="400"><tspan x="1730" dy="0">Decisions, denials, action evidence, verification,</tspan><tspan x="1730" dy="18">and recovery.</tspan></text><text class="" x="350" y="865" text-anchor="start" font-size="14" fill="#52657d" font-weight="400"><tspan x="350" dy="0">Key: blue = application container; teal cylinders = separate SQLite databases; green = person; grey = external system. Dashed arrows point from caller to provider; labels name the relationship, interface, and technology.</tspan></text><text class="" x="350" y="897" text-anchor="start" font-size="14" fill="#52657d" font-weight="400"><tspan x="350" dy="0">Focused C4 container detail: the diagram shows the selected dependencies. The main container view provides system context.</tspan></text></svg>