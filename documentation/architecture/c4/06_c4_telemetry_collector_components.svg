<svg xmlns="http://www.w3.org/2000/svg" width="2600px" height="1320px" viewBox="0 0 2600 1320"><rect width="2600" height="1320" fill="#fff"/><style>text{font-family:Arial,Helvetica,sans-serif;fill:#14263d} .title{font-size:32px;font-weight:700}.subtitle{font-size:18px;fill:#52657d} .layer{font-size:16px;font-weight:700;fill:#1769aa} .small{font-size:13px;fill:#52657d}</style><text class="title" x="48" y="48">C4 Component Diagram — Telemetry Collector</text><text class="subtitle" x="50" y="76">Scope: one C4 container · proposed design · supporting systems are outside the container boundary.</text><rect x="520" y="135" width="1580" height="1010" rx="16" fill="#f4f8fc" stroke="#1769aa" stroke-width="2"/><text class="" x="545" y="168" text-anchor="start" font-size="19" fill="#1769aa" font-weight="700"><tspan x="545" dy="0">Telemetry Collector — C4 container boundary</tspan></text><g class="entity" data-component="Sampling Cycle Coordinator"><rect x="590" y="205" width="650" height="205" rx="10" fill="#fff" stroke="#1769aa" stroke-width="2"/><rect x="583" y="213" width="14" height="8" rx="1" fill="#fff" stroke="#1769aa" stroke-width="1.5"/><rect x="583" y="227" width="14" height="8" rx="1" fill="#fff" stroke="#1769aa" stroke-width="1.5"/><text class="" x="612" y="237" text-anchor="start" font-size="20" fill="#14263d" font-weight="700"><tspan x="612" dy="0">Sampling Cycle Coordinator</tspan></text><text class="" x="612" y="262" text-anchor="start" font-size="14" fill="#52657d" font-weight="400" font-style="italic"><tspan x="612" dy="0">[Component: Python · scheduler]</tspan></text><text class="" x="612" y="294" text-anchor="start" font-size="16" fill="#14263d" font-weight="400"><tspan x="612" dy="0">Starts bounded CPU, RAM, I/O, and pressure sampling cycles.</tspan></text></g><g class="entity" data-component="Host Observation Adapter"><rect x="1380" y="205" width="650" height="205" rx="10" fill="#fff" stroke="#1769aa" stroke-width="2"/><rect x="1373" y="213" width="14" height="8" rx="1" fill="#fff" stroke="#1769aa" stroke-width="1.5"/><rect x="1373" y="227" width="14" height="8" rx="1" fill="#fff" stroke="#1769aa" stroke-width="1.5"/><text class="" x="1402" y="237" text-anchor="start" font-size="20" fill="#14263d" font-weight="700"><tspan x="1402" dy="0">Host Observation Adapter</tspan></text><text class="" x="1402" y="262" text-anchor="start" font-size="14" fill="#52657d" font-weight="400" font-style="italic"><tspan x="1402" dy="0">[Component: psutil · procfs · PSI]</tspan></text><text class="" x="1402" y="294" text-anchor="start" font-size="16" fill="#14263d" font-weight="400"><tspan x="1402" dy="0">Reads host/process counters and supported I/O observations.</tspan></text></g><g class="entity" data-component="Optional Fixed Probe Adapter"><rect x="590" y="510" width="650" height="205" rx="10" fill="#fff" stroke="#1769aa" stroke-width="2"/><rect x="583" y="518" width="14" height="8" rx="1" fill="#fff" stroke="#1769aa" stroke-width="1.5"/><rect x="583" y="532" width="14" height="8" rx="1" fill="#fff" stroke="#1769aa" stroke-width="1.5"/><text class="" x="612" y="542" text-anchor="start" font-size="20" fill="#14263d" font-weight="700"><tspan x="612" dy="0">Optional Fixed Probe Adapter</tspan></text><text class="" x="612" y="567" text-anchor="start" font-size="14" fill="#52657d" font-weight="400" font-style="italic"><tspan x="612" dy="0">[Component: Optional eBPF]</tspan></text><text class="" x="612" y="599" text-anchor="start" font-size="16" fill="#14263d" font-weight="400"><tspan x="612" dy="0">Accepts only reviewed, fixed probes; disabled unless separately approved.</tspan></text></g><g class="entity" data-component="Sample Quality Gate"><rect x="1380" y="510" width="650" height="205" rx="10" fill="#fff" stroke="#1769aa" stroke-width="2"/><rect x="1373" y="518" width="14" height="8" rx="1" fill="#fff" stroke="#1769aa" stroke-width="1.5"/><rect x="1373" y="532" width="14" height="8" rx="1" fill="#fff" stroke="#1769aa" stroke-width="1.5"/><text class="" x="1402" y="542" text-anchor="start" font-size="20" fill="#14263d" font-weight="700"><tspan x="1402" dy="0">Sample Quality Gate</tspan></text><text class="" x="1402" y="567" text-anchor="start" font-size="14" fill="#52657d" font-weight="400" font-style="italic"><tspan x="1402" dy="0">[Component: Validation]</tspan></text><text class="" x="1402" y="599" text-anchor="start" font-size="16" fill="#14263d" font-weight="400"><tspan x="1402" dy="0">Rejects invalid units, stale timestamps, gaps, and malformed samples.</tspan></text></g><g class="entity" data-component="Process &amp; Unit Normalizer"><rect x="590" y="815" width="650" height="205" rx="10" fill="#fff" stroke="#1769aa" stroke-width="2"/><rect x="583" y="823" width="14" height="8" rx="1" fill="#fff" stroke="#1769aa" stroke-width="1.5"/><rect x="583" y="837" width="14" height="8" rx="1" fill="#fff" stroke="#1769aa" stroke-width="1.5"/><text class="" x="612" y="847" text-anchor="start" font-size="20" fill="#14263d" font-weight="700"><tspan x="612" dy="0">Process &amp; Unit Normalizer</tspan></text><text class="" x="612" y="872" text-anchor="start" font-size="14" fill="#52657d" font-weight="400" font-style="italic"><tspan x="612" dy="0">[Component: Identity and schema adapter]</tspan></text><text class="" x="612" y="904" text-anchor="start" font-size="16" fill="#14263d" font-weight="400"><tspan x="612" dy="0">Normalizes resource identity, units, and freshness metadata.</tspan></text></g><g class="entity" data-component="SQLite Telemetry Writer"><rect x="1380" y="815" width="650" height="205" rx="10" fill="#fff" stroke="#1769aa" stroke-width="2"/><rect x="1373" y="823" width="14" height="8" rx="1" fill="#fff" stroke="#1769aa" stroke-width="1.5"/><rect x="1373" y="837" width="14" height="8" rx="1" fill="#fff" stroke="#1769aa" stroke-width="1.5"/><text class="" x="1402" y="847" text-anchor="start" font-size="20" fill="#14263d" font-weight="700"><tspan x="1402" dy="0">SQLite Telemetry Writer</tspan></text><text class="" x="1402" y="872" text-anchor="start" font-size="14" fill="#52657d" font-weight="400" font-style="italic"><tspan x="1402" dy="0">[Component: SQLite]</tspan></text><text class="" x="1402" y="904" text-anchor="start" font-size="16" fill="#14263d" font-weight="400"><tspan x="1402" dy="0">Persists accepted records and bounded read projections.</tspan></text></g><g class="external-endpoint" data-endpoint="Telemetry Store"><path d="M 2220 572.5 C 2220 558.5 2570 558.5 2570 572.5 L 2570 652.5 C 2570 666.5 2220 666.5 2220 652.5 Z" fill="#e7f5f2" stroke="#087f73" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" /><ellipse cx="2395" cy="572.5" rx="175" ry="14" fill="#e7f5f2" stroke="#087f73" stroke-width="1.7"/><text class="" x="2395" y="594.5" text-anchor="middle" font-size="11" fill="#14263d" font-weight="700"><tspan x="2395" dy="0">Telemetry Store</tspan></text><text class="" x="2395" y="652.5" text-anchor="middle" font-size="9" fill="#52657d" font-weight="400" font-style="italic"><tspan x="2395" dy="0">[Database container]</tspan></text></g><g class="external-endpoint" data-endpoint="Ubuntu procfs / PSI / psutil"><rect x="2220" y="253.5" width="350" height="108" rx="9" fill="#eef2f6" stroke="#64748b" stroke-width="1.4"/><text class="" x="2395" y="275.5" text-anchor="middle" font-size="11" fill="#14263d" font-weight="700"><tspan x="2395" dy="0">Ubuntu procfs / PSI /</tspan><tspan x="2395" dy="13">psutil</tspan></text><text class="" x="2395" y="347.5" text-anchor="middle" font-size="9" fill="#52657d" font-weight="400" font-style="italic"><tspan x="2395" dy="0">[External interface / container]</tspan></text></g><g class="external-endpoint" data-endpoint="Ubuntu optional eBPF interface"><rect x="15" y="558.5" width="350" height="108" rx="9" fill="#eef2f6" stroke="#64748b" stroke-width="1.4"/><text class="" x="190" y="580.5" text-anchor="middle" font-size="11" fill="#14263d" font-weight="700"><tspan x="190" dy="0">Ubuntu optional eBPF</ts