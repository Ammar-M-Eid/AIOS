<svg xmlns="http://www.w3.org/2000/svg" width="2600px" height="1500px" viewBox="0 0 2600 1500"><rect width="2600" height="1500" fill="#fff"/><style>text{font-family:Arial,Helvetica,sans-serif;fill:#14263d} .title{font-size:32px;font-weight:700}.subtitle{font-size:18px;fill:#52657d} .layer{font-size:16px;font-weight:700;fill:#1769aa} .small{font-size:13px;fill:#52657d}</style><text class="title" x="48" y="48">C4 Component Diagram — Telemetry Collector</text><text class="subtitle" x="50" y="76">Scope: one C4 container · proposed design · supporting systems are outside the container boundary.</text><rect x="570" y="140" width="1610" height="1240" rx="16" fill="#f4f8fc" stroke="#1769aa" stroke-width="2"/><text class="" x="595" y="173" text-anchor="start" font-size="19" fill="#1769aa" font-weight="700"><tspan x="595" dy="0">Telemetry Collector — C4 container boundary</tspan></text><g class="entity" data-component="Sampling Cycle Coordinator"><rect x="640" y="220" width="540" height="220" rx="10" fill="#fff" stroke="#1769aa" stroke-width="2"/><rect x="633" y="228" width="14" height="8" rx="1" fill="#fff" stroke="#1769aa" stroke-width="1.5"/><rect x="633" y="242" width="14" height="8" rx="1" fill="#fff" stroke="#1769aa" stroke-width="1.5"/><text class="" x="662" y="252" text-anchor="start" font-size="20" fill="#14263d" font-weight="700"><tspan x="662" dy="0">Sampling Cycle Coordinator</tspan></text><text class="" x="662" y="277" text-anchor="start" font-size="14" fill="#52657d" font-weight="400" font-style="italic"><tspan x="662" dy="0">[Component: Python · scheduler]</tspan></text><text class="" x="662" y="309" text-anchor="start" font-size="16" fill="#14263d" font-weight="400"><tspan x="662" dy="0">Starts bounded CPU, RAM, I/O, and pressure sampling</tspan><tspan x="662" dy="20">cycles.</tspan></text></g><g class="entity" data-component="Host Observation Adapter"><rect x="1450" y="220" width="540" height="220" rx="10" fill="#fff" stroke="#1769aa" stroke-width="2"/><rect x="1443" y="228" width="14" height="8" rx="1" fill="#fff" stroke="#1769aa" stroke-width="1.5"/><rect x="1443" y="242" width="14" height="8" rx="1" fill="#fff" stroke="#1769aa" stroke-width="1.5"/><text class="" x="1472" y="252" text-anchor="start" font-size="20" fill="#14263d" font-weight="700"><tspan x="1472" dy="0">Host Observation Adapter</tspan></text><text class="" x="1472" y="277" text-anchor="start" font-size="14" fill="#52657d" font-weight="400" font-style="italic"><tspan x="1472" dy="0">[Component: psutil · procfs · PSI]</tspan></text><text class="" x="1472" y="309" text-anchor="start" font-size="16" fill="#14263d" font-weight="400"><tspan x="1472" dy="0">Reads host/process counters and supported I/O</tspan><tspan x="1472" dy="20">observations.</tspan></text></g><g class="entity" data-component="Optional Fixed Probe Adapter"><rect x="640" y="610" width="540" height="220" rx="10" fill="#fff" stroke="#1769aa" stroke-width="2"/><rect x="633" y="618" width="14" height="8" rx="1" fill="#fff" stroke="#1769aa" stroke-width="1.5"/><rect x="633" y="632" width="14" height="8" rx="1" fill="#fff" stroke="#1769aa" stroke-width="1.5"/><text class="" x="662" y="642" text-anchor="start" font-size="20" fill="#14263d" font-weight="700"><tspan x="662" dy="0">Optional Fixed Probe Adapter</tspan></text><text class="" x="662" y="667" text-anchor="start" font-size="14" fill="#52657d" font-weight="400" font-style="italic"><tspan x="662" dy="0">[Component: Optional eBPF]</tspan></text><text class="" x="662" y="699" text-anchor="start" font-size="16" fill="#14263d" font-weight="400"><tspan x="662" dy="0">Accepts only reviewed, fixed probes; disabled unless</tspan><tspan x="662" dy="20">separately approved.</tspan></text></g><g class="entity" data-component="Sample Quality Gate"><rect x="1450" y="610" width="540" height="220" rx="10" fill="#fff" stroke="#1769aa" stroke-width="2"/><rect x="1443" y="618" width="14" height="8" rx="1" fill="#fff" stroke="#1769aa" stroke-width="1.5"/><rect x="1443" y="632" width="14" height="8" rx="1" fill="#fff" stroke="#1769aa" stroke-width="1.5"/><text class="" x="1472" y="642" text-anchor="start" font-size="20" fill="#14263d" font-weight="700"><tspan x="1472" dy="0">Sample Quality Gate</tspan></text><text class="" x="1472" y="667" text-anchor="start" font-size="14" fill="#52657d" font-weight="400" font-style="italic"><tspan x="1472" dy="0">[Component: Validation]</tspan></text><text class="" x="1472" y="699" text-anchor="start" font-size="16" fill="#14263d" font-weight="400"><tspan x="1472" dy="0">Rejects invalid units, stale timestamps, gaps, and</tspan><tspan x="1472" dy="20">malformed samples.</tspan></text></g><g class="entity" data-component="Process &amp; Unit Normalizer"><rect x="640" y="1000" width="540" height="220" rx="10" fill="#fff" stroke="#1769aa" stroke-width="2"/><rect x="633" y="1008" width="14" height="8" rx="1" fill="#fff" stroke="#1769aa" stroke-width="1.5"/><rect x="633" y="1022" width="14" height="8" rx="1" fill="#fff" stroke="#1769aa" stroke-width="1.5"/><text class="" x="662" y="1032" text-anchor="start" font-size="20" fill="#14263d" font-weight="700"><tspan x="662" dy="0">Process &amp; Unit Normalizer</tspan></text><text class="" x="662" y="1057" text-anchor="start" font-size="14" fill="#52657d" font-weight="400" font-style="italic"><tspan x="662" dy="0">[Component: Identity and schema adapter]</tspan></text><text class="" x="662" y="1089" text-anchor="start" font-size="16" fill="#14263d" font-weight="400"><tspan x="662" dy="0">Normalizes resource identity, units, and freshness</tspan><tspan x="662" dy="20">metadata.</tspan></text></g><g class="entity" data-component="SQLite Telemetry Writer"><rect x="1450" y="1000" width="540" height="220" rx="10" fill="#fff" stroke="#1769aa" stroke-width="2"/><rect x="1443" y="1008" width="14" height="8" rx="1" fill="#fff" stroke="#1769aa" stroke-width="1.5"/><rect x="1443" y="1022" width="14" height="8" rx="1" fill="#fff" stroke="#1769aa" stroke-width="1.5"/><text class="" x="1472" y="1032" text-anchor="start" font-size="20" fill="#14263d" font-weight="700"><tspan x="1472" dy="0">SQLite Telemetry Writer</tspan></text><text class="" x="1472" y="1057" text-anchor="start" font-size="14" fill="#52657d" font-weight="400" font-style="italic"><tspan x="1472" dy="0">[Component: SQLite]</tspan></text><text class="" x="1472" y="1089" text-anchor="start" font-size="16" fill="#14263d" font-weight="400"><tspan x="1472" dy="0">Persists accepted records and bounded read projections.</tspan></text></g><g class="external-endpoint" data-endpoint="Telemetry Store"><path d="M 2235 1065 C 2235 1051 2585 1051 2585 1065 L 2585 1155 C 2585 1169 2235 1169 2235 1155 Z" fill="#e7f5f2" stroke="#087f73" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" /><ellipse cx="2410" cy="1065" rx="175" ry="14" fill="#e7f5f2" stroke="#087f73" stroke-width="1.7"/><text class="" x="2410" y="1087" text-anchor="middle" font-size="11" fill="#14263d" font-weight="700"><tspan x="2410" dy="0">Telemetry Store</tspan></text><text class="" x="2410" y="1155" text-anchor="middle" font-size="9" fill="#52657d" font-weight="400" font-style="italic"><tspan x="2410" dy="0">[Database container]</tspan></text></g><g class="external-endpoint" data-endpoint="Ubuntu procfs / PSI / psutil"><rect x="2235" y="271" width="350" height="118" rx="9" fill="#eef2f6" stroke="#64748b" stroke-width="1.4"/><text class="" x="2410" y="293" text-anchor="middle" font-size="11" fill="#14263d" font-weight="700"><tspan x="2410" dy="0">Ubuntu procfs / PSI /</tspan><tspan x="2410" dy="13">psutil</tspan></text><text class="" x="2410" y="375" text-anchor="middle" font-size="9" fill="#52657d" font-weight="400" font-style="italic"><tspan x="2410" dy="0">[External interface / container]</tspan></text></g><g class="external-endpoint" data-endpoint="Ubuntu optional eBPF interface"><rect x="15" y="661" width="350" height="118" rx="9" fill="#eef2f6" stroke="#64748b" stroke-width="1.4"/><te