<svg xmlns="http://www.w3.org/2000/svg" width="2600px" height="1500px" viewBox="0 0 2600 1500"><rect width="2600" height="1500" fill="#fff"/><style>text{font-family:Arial,Helvetica,sans-serif;fill:#14263d} .title{font-size:32px;font-weight:700}.subtitle{font-size:18px;fill:#52657d} .layer{font-size:16px;font-weight:700;fill:#1769aa} .small{font-size:13px;fill:#52657d}</style><text class="title" x="48" y="48">C4 Component Diagram — AI Inference Service</text><text class="subtitle" x="50" y="76">Scope: one C4 container · proposed design · supporting systems are outside the container boundary.</text><rect x="570" y="140" width="1610" height="1240" rx="16" fill="#f4f8fc" stroke="#1769aa" stroke-width="2"/><text class="" x="595" y="173" text-anchor="start" font-size="19" fill="#1769aa" font-weight="700"><tspan x="595" dy="0">AI Inference Service — C4 container boundary</tspan></text><g class="entity" data-component="Inference Request Endpoint"><rect x="640" y="220" width="540" height="220" rx="10" fill="#fff" stroke="#1769aa" stroke-width="2"/><rect x="633" y="228" width="14" height="8" rx="1" fill="#fff" stroke="#1769aa" stroke-width="1.5"/><rect x="633" y="242" width="14" height="8" rx="1" fill="#fff" stroke="#1769aa" stroke-width="1.5"/><text class="" x="662" y="252" text-anchor="start" font-size="20" fill="#14263d" font-weight="700"><tspan x="662" dy="0">Inference Request Endpoint</tspan></text><text class="" x="662" y="277" text-anchor="start" font-size="14" fill="#52657d" font-weight="400" font-style="italic"><tspan x="662" dy="0">[Component: Proposed local Python service]</tspan></text><text class="" x="662" y="309" text-anchor="start" font-size="16" fill="#14263d" font-weight="400"><tspan x="662" dy="0">Accepts generic evidence-window requests and returns</tspan><tspan x="662" dy="20">typed prediction output.</tspan></text></g><g class="entity" data-component="Evidence Window Reader"><rect x="1450" y="220" width="540" height="220" rx="10" fill="#fff" stroke="#1769aa" stroke-width="2"/><rect x="1443" y="228" width="14" height="8" rx="1" fill="#fff" stroke="#1769aa" stroke-width="1.5"/><rect x="1443" y="242" width="14" height="8" rx="1" fill="#fff" stroke="#1769aa" stroke-width="1.5"/><text class="" x="1472" y="252" text-anchor="start" font-size="20" fill="#14263d" font-weight="700"><tspan x="1472" dy="0">Evidence Window Reader</tspan></text><text class="" x="1472" y="277" text-anchor="start" font-size="14" fill="#52657d" font-weight="400" font-style="italic"><tspan x="1472" dy="0">[Component: SQLite read adapter]</tspan></text><text class="" x="1472" y="309" text-anchor="start" font-size="16" fill="#14263d" font-weight="400"><tspan x="1472" dy="0">Loads a bounded recent CPU, RAM, I/O, and pressure</tspan><tspan x="1472" dy="20">window.</tspan></text></g><g class="entity" data-component="Generic Inference Adapter"><rect x="640" y="610" width="540" height="220" rx="10" fill="#fff" stroke="#1769aa" stroke-width="2"/><rect x="633" y="618" width="14" height="8" rx="1" fill="#fff" stroke="#1769aa" stroke-width="1.5"/><rect x="633" y="632" width="14" height="8" rx="1" fill="#fff" stroke="#1769aa" stroke-width="1.5"/><text class="" x="662" y="642" text-anchor="start" font-size="20" fill="#14263d" font-weight="700"><tspan x="662" dy="0">Generic Inference Adapter</tspan></text><text class="" x="662" y="667" text-anchor="start" font-size="14" fill="#52657d" font-weight="400" font-style="italic"><tspan x="662" dy="0">[Component: Model/runtime boundary TBD]</tspan></text><text class="" x="662" y="699" text-anchor="start" font-size="16" fill="#14263d" font-weight="400"><tspan x="662" dy="0">Invokes the selected inference runtime without fixing</tspan><tspan x="662" dy="20">model internals here.</tspan></text></g><g class="entity" data-component="Prediction Output Guard"><rect x="1450" y="610" width="540" height="220" rx="10" fill="#fff" stroke="#1769aa" stroke-width="2"/><rect x="1443" y="618" width="14" height="8" rx="1" fill="#fff" stroke="#1769aa" stroke-width="1.5"/><rect x="1443" y="632" width="14" height="8" rx="1" fill="#fff" stroke="#1769aa" stroke-width="1.5"/><text class="" x="1472" y="642" text-anchor="start" font-size="20" fill="#14263d" font-weight="700"><tspan x="1472" dy="0">Prediction Output Guard</tspan></text><text class="" x="1472" y="667" text-anchor="start" font-size="14" fill="#52657d" font-weight="400" font-style="italic"><tspan x="1472" dy="0">[Component: Schema and freshness validation]</tspan></text><text class="" x="1472" y="699" text-anchor="start" font-size="16" fill="#14263d" font-weight="400"><tspan x="1472" dy="0">Checks output shape, resource class, confidence</tspan><tspan x="1472" dy="20">metadata, and freshness.</tspan></text></g><g class="external-endpoint" data-endpoint="Decision &amp; Policy Prediction Client"><rect x="15" y="271" width="350" height="118" rx="9" fill="#eef2f6" stroke="#64748b" stroke-width="1.4"/><text class="" x="190" y="293" text-anchor="middle" font-size="11" fill="#14263d" font-weight="700"><tspan x="190" dy="0">Decision &amp; Policy</tspan><tspan x="190" dy="13">Prediction Client</tspan></text><text class="" x="190" y="375" text-anchor="middle" font-size="9" fill="#52657d" font-weight="400" font-style="italic"><tspan x="190" dy="0">[External interface / container]</tspan></text></g><g class="external-endpoint" data-endpoint="Telemetry Store"><path d="M 2235 285 C 2235 271 2585 271 2585 285 L 2585 375 C 2585 389 2235 389 2235 375 Z" fill="#e7f5f2" stroke="#087f73" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" /><ellipse cx="2410" cy="285" rx="175" ry="14" fill="#e7f5f2" stroke="#087f73" stroke-width="1.7"/><text class="" x="2410" y="307" text-anchor="middle" font-size="11" fill="#14263d" font-weight="700"><tspan x="2410" dy="0">Telemetry Store</tspan></text><text class="" x="2410" y="375" text-anchor="middle" font-size="9" fill="#52657d" font-weight="400" font-style="italic"><tspan x="2410" dy="0">[Database container]</tspan></text></g><g class="external-endpoint" data-endpoint="Selected generic runtime boundary"><rect x="15" y="661" width="350" height="118" rx="9" fill="#eef2f6" stroke="#64748b" stroke-width="1.4"/><text class="" x="190" y="683" text-anchor="middle" font-size="11" fill="#14263d" font-weight="700"><tspan x="190" dy="0">Selected generic runtime</tspan><tspan x="190" dy="13">boundary</tspan></text><text class="" x="190" y="765" text-anchor="middle" font-size="9" fill="#52657d" font-weight="400" font-style="italic"><tspan x="190" dy="0">[External interface / container]</tspan></text></g><path d="M 378 280 L 627 280" fill="none" stroke="#64748b" stroke-width="1.8" stroke-dasharray="7 5" stroke-linecap="round" stroke-linejoin="round" /><path d="M 618 284 L 627 280 L 618 276" fill="none" stroke="#64748b" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M 360 275 h 10 v 10 h -10 z" fill="#fff" stroke="#1769aa" stroke-width="2"/><g transform="translate(373 280) rotate(0)"><path d="M 0 -5 A 5 5 0 0 0 0 5" fill="none" stroke="#1769aa" stroke-width="2.4"/><path d="M -18 0 H -5" fill="none" stroke="#1769aa" stroke-width="2.4" stroke-linecap="round"/></g><path d="M 635 275 h 10 v 10 h -10 z" fill="#fff" stroke="#087f73" stroke-width="2"/><circle cx="632" cy="280" r="5" fill="#fff" stroke="#087f73" stroke-width="2.4"/><text class="" x="502.5" y="234" text-anchor="middle" font-size="12" fill="#14263d" font-weight="700"><tspan x="502.5" dy="0">requests validated prediction</tspan><tspan x="502.5" dy="15">IInference</tspan></text><path d="M 1193 290 L 1204 290 L 1200 300 L 1420 300 L 1426 290 L 1437 290" fill="none" stroke="#64748b" stroke-width="1.8" stroke-dasharray="7 5" stroke-linecap="round" stroke-linejoin="round" /><path d="M 1428 294 L 1437 290 L 1428 286" fill="none" stroke="#64748b" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M 1175 285 h 10 v 10 h -10 z" fill="#fff" stroke="#1769aa" stroke-width="2"/><g transform