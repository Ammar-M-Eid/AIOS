<svg xmlns="http://www.w3.org/2000/svg" width="2600px" height="1320px" viewBox="0 0 2600 1320"><rect width="2600" height="1320" fill="#fff"/><style>text{font-family:Arial,Helvetica,sans-serif;fill:#14263d} .title{font-size:32px;font-weight:700}.subtitle{font-size:18px;fill:#52657d} .layer{font-size:16px;font-weight:700;fill:#1769aa} .small{font-size:13px;fill:#52657d}</style><text class="title" x="48" y="48">C4 Component Diagram — AI Inference Service</text><text class="subtitle" x="50" y="76">Scope: one C4 container · proposed design · supporting systems are outside the container boundary.</text><rect x="520" y="135" width="1580" height="1010" rx="16" fill="#f4f8fc" stroke="#1769aa" stroke-width="2"/><text class="" x="545" y="168" text-anchor="start" font-size="19" fill="#1769aa" font-weight="700"><tspan x="545" dy="0">AI Inference Service — C4 container boundary</tspan></text><g class="entity" data-component="Inference Request Endpoint"><rect x="590" y="205" width="650" height="205" rx="10" fill="#fff" stroke="#1769aa" stroke-width="2"/><rect x="583" y="213" width="14" height="8" rx="1" fill="#fff" stroke="#1769aa" stroke-width="1.5"/><rect x="583" y="227" width="14" height="8" rx="1" fill="#fff" stroke="#1769aa" stroke-width="1.5"/><text class="" x="612" y="237" text-anchor="start" font-size="20" fill="#14263d" font-weight="700"><tspan x="612" dy="0">Inference Request Endpoint</tspan></text><text class="" x="612" y="262" text-anchor="start" font-size="14" fill="#52657d" font-weight="400" font-style="italic"><tspan x="612" dy="0">[Component: Proposed local Python service]</tspan></text><text class="" x="612" y="294" text-anchor="start" font-size="16" fill="#14263d" font-weight="400"><tspan x="612" dy="0">Accepts generic evidence-window requests and returns typed prediction output.</tspan></text></g><g class="entity" data-component="Evidence Window Reader"><rect x="1380" y="205" width="650" height="205" rx="10" fill="#fff" stroke="#1769aa" stroke-width="2"/><rect x="1373" y="213" width="14" height="8" rx="1" fill="#fff" stroke="#1769aa" stroke-width="1.5"/><rect x="1373" y="227" width="14" height="8" rx="1" fill="#fff" stroke="#1769aa" stroke-width="1.5"/><text class="" x="1402" y="237" text-anchor="start" font-size="20" fill="#14263d" font-weight="700"><tspan x="1402" dy="0">Evidence Window Reader</tspan></text><text class="" x="1402" y="262" text-anchor="start" font-size="14" fill="#52657d" font-weight="400" font-style="italic"><tspan x="1402" dy="0">[Component: SQLite read adapter]</tspan></text><text class="" x="1402" y="294" text-anchor="start" font-size="16" fill="#14263d" font-weight="400"><tspan x="1402" dy="0">Loads a bounded recent CPU, RAM, I/O, and pressure window.</tspan></text></g><g class="entity" data-component="Generic Inference Adapter"><rect x="590" y="510" width="650" height="205" rx="10" fill="#fff" stroke="#1769aa" stroke-width="2"/><rect x="583" y="518" width="14" height="8" rx="1" fill="#fff" stroke="#1769aa" stroke-width="1.5"/><rect x="583" y="532" width="14" height="8" rx="1" fill="#fff" stroke="#1769aa" stroke-width="1.5"/><text class="" x="612" y="542" text-anchor="start" font-size="20" fill="#14263d" font-weight="700"><tspan x="612" dy="0">Generic Inference Adapter</tspan></text><text class="" x="612" y="567" text-anchor="start" font-size="14" fill="#52657d" font-weight="400" font-style="italic"><tspan x="612" dy="0">[Component: Model/runtime boundary TBD]</tspan></text><text class="" x="612" y="599" text-anchor="start" font-size="16" fill="#14263d" font-weight="400"><tspan x="612" dy="0">Invokes the selected inference runtime without fixing model internals here.</tspan></text></g><g class="entity" data-component="Prediction Output Guard"><rect x="1380" y="510" width="650" height="205" rx="10" fill="#fff" stroke="#1769aa" stroke-width="2"/><rect x="1373" y="518" width="14" height="8" rx="1" fill="#fff" stroke="#1769aa" stroke-width="1.5"/><rect x="1373" y="532" width="14" height="8" rx="1" fill="#fff" stroke="#1769aa" stroke-width="1.5"/><text class="" x="1402" y="542" text-anchor="start" font-size="20" fill="#14263d" font-weight="700"><tspan x="1402" dy="0">Prediction Output Guard</tspan></text><text class="" x="1402" y="567" text-anchor="start" font-size="14" fill="#52657d" font-weight="400" font-style="italic"><tspan x="1402" dy="0">[Component: Schema and freshness validation]</tspan></text><text class="" x="1402" y="599" text-anchor="start" font-size="16" fill="#14263d" font-weight="400"><tspan x="1402" dy="0">Checks output shape, resource class, confidence metadata, and freshness.</tspan></text></g><g class="external-endpoint" data-endpoint="Decision &amp; Policy Prediction Client"><rect x="15" y="253.5" width="350" height="108" rx="9" fill="#eef2f6" stroke="#64748b" stroke-width="1.4"/><text class="" x="190" y="275.5" text-anchor="middle" font-size="11" fill="#14263d" font-weight="700"><tspan x="190" dy="0">Decision &amp; Policy</tspan><tspan x="190" dy="13">Prediction Client</tspan></text><text class="" x="190" y="347.5" text-anchor="middle" font-size="9" fill="#52657d" font-weight="400" font-style="italic"><tspan x="190" dy="0">[External interface / container]</tspan></text></g><g class="external-endpoint" data-endpoint="Telemetry Store"><path d="M 2220 267.5 C 2220 253.5 2570 253.5 2570 267.5 L 2570 347.5 C 2570 361.5 2220 361.5 2220 347.5 Z" fill="#e7f5f2" stroke="#087f73" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" /><ellipse cx="2395" cy="267.5" rx="175" ry="14" fill="#e7f5f2" stroke="#087f73" stroke-width="1.7"/><text class="" x="2395" y="289.5" text-anchor="middle" font-size="11" fill="#14263d" font-weight="700"><tspan x="2395" dy="0">Telemetry Store</tspan></text><text class="" x="2395" y="347.5" text-anchor="middle" font-size="9" fill="#52657d" font-weight="400" font-style="italic"><tspan x="2395" dy="0">[Database container]</tspan></text></g><g class="external-endpoint" data-endpoint="Selected generic runtime boundary"