sform="translate(890 448) rotate(90)"><path d="M 0 -5 A 5 5 0 0 0 0 5" fill="none" stroke="#1769aa" stroke-width="2.4"/><path d="M -18 0 H -5" fill="none" stroke="#1769aa" stroke-width="2.4" stroke-linecap="round"/></g><path d="M 885 605 h 10 v 10 h -10 z" fill="#fff" stroke="#087f73" stroke-width="2"/><circle cx="890" cy="602" r="5" fill="#fff" stroke="#087f73" stroke-width="2.4"/><text class="" x="790.5" y="513" text-anchor="middle" font-size="12" fill="#14263d" font-weight="700"><tspan x="790.5" dy="0">invokes model adapter</tspan><tspan x="790.5" dy="15">IModelRuntime</tspan></text><path d="M 1193 320 L 1420 320 L 1420 720 L 1426 710 L 1437 710" fill="none" stroke="#64748b" stroke-width="1.8" stroke-dasharray="7 5" stroke-linecap="round" stroke-linejoin="round" /><path d="M 1428 714 L 1437 710 L 1428 706" fill="none" stroke="#64748b" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M 1175 315 h 10 v 10 h -10 z" fill="#fff" stroke="#1769aa" stroke-width="2"/><g transform="translate(1188 320) rotate(0)"><path d="M 0 -5 A 5 5 0 0 0 0 5" fill="none" stroke="#1769aa" stroke-width="2.4"/><path d="M -18 0 H -5" fill="none" stroke="#1769aa" stroke-width="2.4" stroke-linecap="round"/></g><path d="M 1445 705 h 10 v 10 h -10 z" fill="#fff" stroke="#087f73" stroke-width="2"/><circle cx="1442" cy="710" r="5" fill="#fff" stroke="#087f73" stroke-width="2.4"/><text class="" x="1285" y="513" text-anchor="middle" font-size="12" fill="#14263d" font-weight="700"><tspan x="1285" dy="0">validates prediction and freshness</tspan><tspan x="1285" dy="15">IPredictionValidation</tspan></text><path d="M 1437 720 L 1193 720" fill="none" stroke="#64748b" stroke-width="1.8" stroke-dasharray="7 5" stroke-linecap="round" stroke-linejoin="round" /><path d="M 1202 716 L 1193 720 L 1202 724" fill="none" stroke="#64748b" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M 1445 715 h 10 v 10 h -10 z" fill="#fff" stroke="#1769aa" stroke-width="2"/><g transform="translate(1442 720) rotate(180)"><path d="M 0 -5 A 5 5 0 0 0 0 5" fill="none" stroke="#1769aa" stroke-width="2.4"/><path d="M -18 0 H -5" fill="none" stroke="#1769aa" stroke-width="2.4" stroke-linecap="round"/></g><path d="M 1175 715 h 10 v 10 h -10 z" fill="#fff" stroke="#087f73" stroke-width="2"/><circle cx="1188" cy="720" r="5" fill="#fff" stroke="#087f73" stroke-width="2.4"/><text class="" x="1315" y="674" text-anchor="middle" font-size="12" fill="#14263d" font-weight="700"><tspan x="1315" dy="0">reads prediction result from</tspan><tspan x="1315" dy="15">IGenericPredictionResult</tspan></text><path d="M 627 730 L 616 730 L 620 740 L 380 740 L 389 730 L 378 730" fill="none" stroke="#64748b" stroke-width="1.8" stroke-dasharray="7 5" stroke-linecap="round" stroke-linejoin="round" /><path d="M 387 726 L 378 730 L 387 734" fill="none" stroke="#64748b" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M 635 725 h 10 v 10 h -10 z" fill="#fff" stroke="#1769aa" stroke-width="2"/><g transform="translate(632 730) rotate(180)"><path d="M 0 -5 A 5 5 0 0 0 0 5" fill="none" stroke="#1769aa" stroke-width="2.4"/><path d="M -18 0 H -5" fill="none" stroke="#1769aa" stroke-width="2.4" stroke-linecap="round"/></g><path d="M 360 725 h 10 v 10 h -10 z" fill="#fff" stroke="#087f73" stroke-width="2"/><circle cx="373" cy="730" r="5" fill="#fff" stroke="#087f73" stroke-width="2.4"/><text class="" x="500" y="694" text-anchor="middle" font-size="12" fill="#14263d" font-weight="700"><tspan x="500" dy="0">invokes inference runtime</tspan><tspan x="500" dy="15">IGenericInferenceRuntime</tspan></text><text class="" x="74" y="1435" text-anchor="start" font-size="15" fill="#52657d" font-weight="400"><tspan x="74" dy="0">Key: blue rectangles are components; teal cylinders are the separate SQLite databases; grey boxes are external systems/interfaces. UML port squares, required sockets, and provided lollipops show named interfaces. Dashed arrows show consumer → provider dependency by project convention.</tspan></text></svg>