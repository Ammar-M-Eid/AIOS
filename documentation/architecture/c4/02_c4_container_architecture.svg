<svg xmlns="http://www.w3.org/2000/svg" width="2840px" height="1510px" viewBox="0 0 2840 1510"><rect width="2840" height="1510" fill="#fff"/><style>text{font-family:Arial,Helvetica,sans-serif;fill:#14263d} .title{font-size:32px;font-weight:700}.subtitle{font-size:18px;fill:#52657d} .layer{font-size:16px;font-weight:700;fill:#1769aa} .small{font-size:13px;fill:#52657d}</style><text class="title" x="48" y="48">C4 Container Diagram — AIOS Host-local Runtime</text><text class="subtitle" x="50" y="76">Core runtime path; focused companion views show dashboard, audit, watchdog, and telemetry dependencies.</text><rect x="250" y="115" width="1980" height="1200" rx="16" fill="#fff" stroke="#1769aa" stroke-width="2.2"/><text class="" x="274" y="144" text-anchor="start" font-size="17" fill="#1769aa" font-weight="700"><tspan x="274" dy="0">AIOS software system boundary</tspan></text><path d="M 245 295 L 300 295" fill="none" stroke="#64748b" stroke-width="2" stroke-dasharray="8 7" stroke-linecap="round" stroke-linejoin="round" /><path d="M 289 300 L 300 295 L 289 290" fill="none" stroke="#64748b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="175" y="179" width="190" height="30" rx="4" fill="#fff" stroke="none" stroke-width="0"/><text class="" x="270" y="200" text-anchor="middle" font-size="14" fill="#14263d" font-weight="700"><tspan x="270" dy="0">read-only status · HTTP GET</tspan></text><path d="M 550 880 L 550 1035 L 1050 1035 L 1050 1175" fill="none" stroke="#64748b" stroke-width="2" stroke-dasharray="8 7" stroke-linecap="round" stroke-linejoin="round" /><path d="M 1045 1164 L 1050 1175 L 1055 1164" fill="none" stroke="#64748b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="690" y="984" width="220" height="30" rx="4" fill="#fff" stroke="none" stroke-width="0"/><text class="" x="800" y="1005" text-anchor="middle" font-size="14" fill="#14263d" font-weight="700"><tspan x="800" dy="0">persist samples · SQLite</tspan></text><path d="M 550 880 L 550 1280 L 2550 1280 L 2550 830" fill="none" stroke="#64748b" stroke-width="2" stroke-dasharray="8 7" stroke-linecap="round" stroke-linejoin="round" /><path d="M 2555 841 L 2550 830 L 2545 841" fill="none" stroke="#64748b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="1725" y="1234" width="250" height="30" rx="4" fill="#fff" stroke="none" stroke-width="0"/><text class="" x="1850" y="1255" text-anchor="middle" font-size="14" fill="#14263d" font-weight="700"><tspan x="1850" dy="0">read telemetry · procfs / PSI</tspan></text><path d="M 1300 880 L 1300 1100" fill="none" stroke="#64748b" stroke-width="2" stroke-dasharray="8 7" stroke-linecap="round" stroke-linejoin="round" /><path d="M 1295 1089 L 1300 1100 L 1305 1089" fill="none" stroke="#64748b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="1195" y="974" width="210" height="30" rx="4" fill="#fff" stroke="none" stroke-width="0"/><text class="" x="1300" y="995" text-anchor="middle" font-size="14" fill="#14263d" font-weight="700"><tspan x="1300" dy="0">read evidence · SQLite</tspan></text><path d="M 1750 300 L 1650 300 L 1650 790 L 1550 790" fill="none" stroke="#64748b" stroke-width="2" stroke-dasharray="8 7" stroke-linecap="round" stroke-linejoin="round" /><path d="M 1561 785 L 1550 790 L 1561 795" fill="none" stroke="#64748b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="1525" y="534" width="250" height="30" rx="4" fill="#fff" stroke="none" stroke-width="0"/><text class="" x="1650" y="555" text-anchor="middle" font-size="14" fill="#14263d" font-weight="700"><tspan x="1650" dy="0">request prediction · IPC TBD</tspan></text><path d="M 2000 380 L 2000 820" fill="none" stroke="#64748b" stroke-width="2" stroke-dasharray="8 7" stroke-linecap="round" stroke-linejoin="round" /><path d="M 1995 809 L 2000 820 L 2005 809" fill="none" stroke="#64748b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="1865" y="584" width="270" height="30" rx="4" fill="#fff" stroke="none" stroke-width="0"/><text class="" x="2000" y="605" text-anchor="middle" font-size="14" fill="#14263d" font-weight="700"><tspan x="2000" dy="0">submit gated action · Unix socket</tspan></text><path d="M 2250 910 L 2290 910 L 2290 1060 L 2550 1060 L 2550 830" fill="none" stroke="#64748b" stroke-width="2" stroke-dasharray="8 7" stroke-linecap="round" stroke-linejoin="round" /><path d="M 2555 841 L 2550 830 L 2545 841" fill="none" stroke="#64748b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="2300" y="1014" width="220" height="30" rx="4" fill="#fff" stroke="none" stroke-width="0"/><text class="" x="2410" y="1035" text-anchor="middle" font-size="14" fill="#14263d" font-weight="700"><tspan x="2410" dy="0">apply limits · cgroups v2</tspan></text><g class="person"><rect x="27" y="275" width="206" height="95" rx="24" fill="#f0f7ec" stroke="#087f73" stroke-width="2"/><path d="M 130 268 V 276" stroke="#087f73" stroke-width="3"/><circle cx="130" cy="248" r="20" fill="#f0f7ec" stroke="#087f73" stroke-width="2"/><text class="" x="130" y="298" text-anchor="middle" font-size="17" fill="#14263d" font-weight="700"><tspan x="130" dy="0">Sysadmin / SRE</tspan></text><text class="" x="130" y="319" text-anchor="middle" font-size="12" fill="#52657d" font-weight="400" font-style="italic"><tspan x="130" dy="0">Person · read-only viewer</tspan></text><text class="" x="130" y="340" text-anchor="middle" font-size="12" fill="#14263d" font-weight="400"><tspan x="130" dy="0">Reviews dashboard projections.</tspan></text></g><rect x="300" y="220" width="500" height="160" rx="12" fill="#eaf3fb" stroke="#2f80c9" stroke-width="1.6"/><text class="" x="550" y="248" text-anchor="middle" font-size="18" fill="#14263d" font-weight="700"><tspan x="550" dy="0">Read-only Dashboard API</tspan></text><text class="" x="550" y="271" text-anchor="middle" font-size="12" fill="#52657d" font-weight="400" font-style="italic"><tspan x="550" dy="0">Container · Python · FastAPI</tspan></text><text class="" x="550" y="306" text-anchor="middle" font-size="16" fill="#14263d" font-weight="400"><tspan x="550" dy="0">Serves status, recommendation, health, and audit</tspan><tspan x="550" dy="20">projections. Human access is read-only.</tspan></text><rect x="1750" y="220" width="500" height="160" rx="12" fill="#eaf3fb" stroke="#2f80c9" stroke-width="1.6"/><text class="" x="2000" y="248" text-anchor="middle" font-size="18" fill="#14263d" font-weight="700"><tspan x="2000" dy="0">Decision &amp; Policy Service</tspan></text><text class="" x="2000" y="271" text-anchor="middle" font-size="12" fill="#52657d" font-weight="400" font-style="italic"><tspan x="2000" dy="0">Container · Proposed Python service</tspan></text><text class="" x="2000" y="306" text-anchor="middle" font-size="16" fill="#14263d" font-weight="400"><tspan x="2000" dy="0">Builds per-process decisions; applies OBSERVE_ONLY</tspan><tspan x="2000" dy="20">defaults and independent resource gates.</tspan></text><rect x="1050" y="720" width="500" height="160" rx="12" fill="#eaf3fb" stroke="#2f80c9" stroke-width="1.6"/><text class="" x="1300" y="748" text-anchor="middle" font-size="18" fill="#14263d" font-weight="700"><tspan x="1300" dy="0">AI Inference Service</tspan></text><text class="" x="1300" y="771" text-anchor="middle" font-size="12" fill="#52657d" font-weight="400" font-style="italic"><tspan x="1300" dy="0">Container · Proposed generic service boundary</tspan></text><text class="" x="1300" y="806" text-anchor="middle" font-size="16" fill="#14263d" font-weight="400"><tspan x="1300" dy="0">Reads a bounded evidence window and returns</tspan><tspan x="1300" dy="20">validated generic predictions.</tspan></text><rect x="300" y="720" width="500" height="160" rx="12" fill="#eaf3fb" stroke="#2f80c9" stroke-width="1.6"/><text class="" x="550" y="748" text-anchor="middle" font-size="18" fill="#14263d" font-weight="700"><tspan x="550" dy="0">Telemetry Collector</tspan></text><text class="" x="550" y="771" text-anchor="middle" font-size="12" fill="#52657d" font-weight="400" font-style="italic"><tspan x="550" dy="0">Container · Python · psutil · procfs/PSI · optional eBPF</tspan></text><text class="" x="550" y="806" text-anchor="middle" font-size="16" fill="#14263d" font-weight="400"><tspan x="550" dy="0">Read-only CPU, RAM, I/O, and pressure collection</tspan><tspan x="550" dy="20">with sample validation.</tspan></text><rect x="1750" y="820" width="500" height="180" rx="12" fill="#eaf3fb" stroke="#2f80c9" stroke-width="1.6"/><text class="" x="2000" y="848" text-anchor="middle" font-size="18" fill="#14263d" font-weight="700"><tspan x="2000" dy="0">Resource Manager / Actuator</tspan></text><text class="" x="2000" y="871" text-anchor="middle" font-size="12" fill="#52657d" font-weight="400" font-style="italic"><tspan x="2000" dy="0">Container · Python · Unix socket · SO_PEERCRED · cgroups v2</tspan></text><text class="" x="2000" y="906" text-anchor="middle" font-size="16" fill="#14263d" font-weight="400"><tspan x="2000" dy="0">Only proposed host writer; applies separately gated</tspan><tspan x="2000" dy="20">CPU, RAM, and supported I/O limits.</tspan></text><path d="M 1050 1119 C 1050 1100 1550 1100 1550 1119 L 1550 1231 C 1550 1250 1050 1250 1050 1231 Z" fill="#e7f5f2" stroke="#087f73" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" /><ellipse cx="1300" cy="1119" rx="250" ry="19" fill="#e7f5f2" stroke="#087f73" stroke-width="1.7"/><text class="" x="1300" y="1158" text-anchor="middle" font-size="18" fill="#14263d" font-weight="700"><tspan x="1300" dy="0">Telemetry &amp; Read-Projection Store</tspan></text><text class="" x="1300" y="1178" text-anchor="middle" font-size="12" fill="#52657d" font-weight="400" font-style="italic"><tspan x="1300" dy="0">Container · database · SQLite · local database container</tspan></text><text class="" x="1300" y="1201" text-anchor="middle" font-size="15" fill="#14263d" font-weight="400"><tspan x="1300" dy="0">Bounded samples, freshness metadata, and</tspan><tspan x="1300" dy="18">read-only projections.</tspan></text><rect x="2320" y="650" width="460" height="180" rx="12" fill="#eef2f6" stroke="#64748b" stroke-width="1.6"/><text class="" x="2550" y="678" text-anchor="middle" font-size="18" fill="#14263d" font-weight="700"><tspan x="2550" dy="0">Ubuntu 24.04 host</tspan></text><text class="" x="2550" y="701" text-anchor="middle" font-size="12" fill="#52657d" font-weight="400" font-style="italic"><tspan x="2550" dy="0">External software system · Ubuntu 24.04 · Linux</tspan></text><text class="" x="2550" y="736" text-anchor="middle" font-size="16" fill="#14263d" font-weight="400"><tspan x="2550" dy="0">Reads procfs / PSI.</tspan><tspan x="2550" dy="20">Accepts gated cgroups v2 writes.</tspan></text><text class="" x="270" y="1340" text-anchor="start" font-size="14" fill="#52657d" font-weight="400"><tspan x="270" dy="0">Key: blue = application container; teal cylinders = separate SQLite databases; green = person; grey = external system. Dashed arrows point from caller to provider; labels name the relationship, interface, and technology.</tspan></text><text class="" x="270" y="1372" text-anchor="start" font-size="14" fill="#52657d" font-weight="400"><tspan x="270" dy="0">This C4 container view shows the main runtime path; focused container views complete the relationships. Scoped component views explain internal responsibilities.</tspan></text></svg>