<svg xmlns="http://www.w3.org/2000/svg" width="2100px" height="1320px" viewBox="0 0 2100 1320"><rect width="2100" height="1320" fill="#fff"/><style>text{font-family:Arial,Helvetica,sans-serif;fill:#14263d} .title{font-size:32px;font-weight:700}.subtitle{font-size:18px;fill:#52657d} .layer{font-size:16px;font-weight:700;fill:#1769aa} .small{font-size:13px;fill:#52657d}</style><text class="title" x="48" y="48">C4 Deployment Diagram — Proposed Single-Host Profile</text><text class="subtitle" x="50" y="76">Proposed AIOS service and data containers are placed on one Ubuntu 24.04 host; host capabilities and readiness remain unverified.</text><rect x="350" y="110" width="1650" height="1005" rx="18" fill="#fbfdff" stroke="#1769aa" stroke-width="2"/><text class="" x="375" y="143" text-anchor="start" font-size="18" fill="#1769aa" font-weight="700"><tspan x="375" dy="0">Deployment Node · physical or virtual Linux host</tspan></text><rect x="380" y="160" width="1590" height="900" rx="14" fill="#f8fbff" stroke="#c7d5e3" stroke-width="1.5"/><text class="" x="405" y="193" text-anchor="start" font-size="16" fill="#1769aa" font-weight="700"><tspan x="405" dy="0">Execution Environment · Ubuntu 24.04 / Linux kernel</tspan></text><rect x="435" y="215" width="390" height="95" rx="12" fill="#eef2f6" stroke="#64748b" stroke-width="1.6"/><text class="" x="630" y="246" text-anchor="middle" font-size="20" fill="#14263d" font-weight="700"><tspan x="630" dy="0">systemd service manager</tspan></text><text class="" x="630" y="271" text-anchor="middle" font-size="14" fill="#52657d" font-weight="400" font-style="italic"><tspan x="630" dy="0">Host supervisor</tspan></text><text class="" x="630" y="301" text-anchor="middle" font-size="16" fill="#14263d" font-weight="400"><tspan x="630" dy="0">Starts and restarts the proposed AIOS service containers.</tspan></text><rect x="420" y="335" width="1550" height="480" rx="14" fill="#f4f8fc" stroke="#1769aa" stroke-width="1.8"/><text class="" x="440" y="364" text-anchor="start" font-size="15" fill="#1769aa" font-weight="700"><tspan x="440" dy="0">AIOS software system · proposed container instances</tspan></text><rect x="1345" y="375" width="600" height="340" rx="12" fill="#e7f5f2" stroke="#8bbdb5" stroke-width="1.4"/><text class="" x="1365" y="403" text-anchor="start" font-size="15" fill="#087f73" font-weight="700"><tspan x="1365" dy="0">AIOS data containers</tspan></text><rect x="1345" y="835" width="600" height="175" rx="12" fill="#eef2f6" stroke="#96a4b4" stroke-width="1.4"/><text class="" x="1365" y="863" text-anchor="start" font-size="15" fill="#14263d" font-weight="700"><tspan x="1365" dy="0">Linux host APIs · outside AIOS</tspan></text><path d="M 295 425 L 319 425 L 320 420 L 440 420 L 440 400 L 441 395 L 465 395" fill="none" stroke="#64748b" stroke-width="1.8" stroke-dasharray="7 5" stroke-linecap="round" stroke-linejoin="round" /><path d="M 456 399 L 465 395 L 456 391" fill="none" stroke="#64748b" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><text class="" x="380" y="374" text-anchor="middle" font-size="12" fill="#14263d" font-weight="700"><tspan x="380" dy="0">requests read-only dashboard view · local HTTP GET</tspan><tspan x="380" dy="15">IDashboardRead</tspan></text><path d="M 1300 405 L 1324 405 L 1320 400 L 1320 900 L 1360 900 L 1356 895 L 1380 895" fill="none" stroke="#64748b" stroke-width="1.8" stroke-dasharray="7 5" stroke-linecap="round" stroke-linejoin="round" /><path d="M 1371 899 L 1380 895 L 1371 891" fill="none" stroke="#64748b" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><text class="" x="1205" y="890.5" text-anchor="middle" font-size="12" fill="#14263d" font-weight="700"><tspan x="1205" dy="0">reads host metrics · procfs / PSI</tspan><tspan x="1205" dy="15">IHostTelemetry</tspan></text><path d="M 1300 695 L 1324 695 L 1320 700 L 1320 900 L 1360 900 L 1356 905 L 1380 905" fill="none" stroke="#64748b" stroke-width="1.8" stroke-dasharray="7 5" stroke-li