tspan x="1100" dy="0">Telemetry Collector</tspan></text><text class="" x="1100" y="441" text-anchor="middle" font-size="14" fill="#52657d" font-weight="400" font-style="italic"><tspan x="1100" dy="0">Python · psutil / procfs / PSI</tspan></text><text class="" x="1100" y="471" text-anchor="middle" font-size="16" fill="#14263d" font-weight="400"><tspan x="1100" dy="0">Container instance · read-only monitoring.</tspan></text><rect x="465" y="525" width="400" height="120" rx="12" fill="#eaf3fb" stroke="#2f80c9" stroke-width="1.6"/><text class="" x="665" y="556" text-anchor="middle" font-size="20" fill="#14263d" font-weight="700"><tspan x="665" dy="0">Decision &amp; Policy Service</tspan></text><text class="" x="665" y="581" text-anchor="middle" font-size="14" fill="#52657d" font-weight="400" font-style="italic"><tspan x="665" dy="0">Proposed Python process</tspan></text><text class="" x="665" y="611" text-anchor="middle" font-size="16" fill="#14263d" font-weight="400"><tspan x="665" dy="0">Container instance · policy admission.</tspan></text><rect x="900" y="525" width="400" height="120" rx="12" fill="#eaf3fb" stroke="#2f80c9" stroke-width="1.6"/><text class="" x="1100" y="556" text-anchor="middle" font-size="20" fill="#14263d" font-weight="700"><tspan x="1100" dy="0">AI Inference Service</tspan></text><text class="" x="1100" y="581" text-anchor="middle" font-size="14" fill="#52657d" font-weight="400" font-style="italic"><tspan x="1100" dy="0">Generic prediction boundary</tspan></text><text class="" x="1100" y="611" text-anchor="middle" font-size="16" fill="#14263d" font-weight="400"><tspan x="1100" dy="0">Container instance · model internals TBD.</tspan></text><rect x="465" y="665" width="400" height="120" rx="12" fill="#eaf3fb" stroke="#2f80c9" stroke-width="1.6"/><text class="" x="665" y="696" text-anchor="middle" font-size="20" fill="#14263d" font-weight="700"><tspan x="665" dy="0">Safety Watchdog</tspan></text><text class="" x="665" y="721" text-anchor="middle" font-size="14" fill="#52657d" font-weight="400" font-style="italic"><tspan x="665" dy="0">Proposed Python process</tspan></text><text class="" x="665" y="751" text-anchor="middle" font-size="16" fill="#14263d" font-weight="400"><tspan x="665" dy="0">Container instance · health and guarded recovery.</tspan></text><rect x="900" y="665" width="400" height="120" rx="12" fill="#eaf3fb" stroke="#2f80c9" stroke-width="1.6"/><text class="" x="1100" y="696" text-anchor="middle" font-size="20" fill="#14263d" font-weight="700"><tspan x="1100" dy="0">Resource Manager / Actuator</tspan></text><text class="" x="1100" y="721" text-anchor="middle" font-size="14" fill="#52657d" font-weight="400" font-style="italic"><tspan x="1100" dy="0">Unix socket · SO_PEERCRED</tspan></text><text class="" x="1100" y="751" text-anchor="middle" font-size="16" fill="#14263d" font-weight="400"><tspan x="1100" dy="0">Container instance · only proposed host writer.</tspan></text><path d="M 1375 440 C 1375 420 1915 420 1915 440 L 1915 530 C 1915 550 1375 550 1375 530 Z" fill="#e7f5f2" stroke="#087f73" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" /><ellipse cx="1645" cy="440" rx="270" ry="20" fill="#e7f5f2" stroke="#087f73" stroke-width="1.7"/><text class="" x="1645" y="470" text-anchor="middle" font-size="17" fill="#14263d" font-weight="700"><tspan x="1645" dy="0">Telemetry &amp; Read-Projection Store</tspan></text><text class="" x="1645" y="490" text-anchor="middle" font-size="12" fill="#52657d" font-weight="400" font-style="italic"><tspan x="1645" dy="0">SQLite · host-local</tspan></text><text class="" x="1645" y="510" text-anchor="middle" font-size="12" fill="#14263d" font-weight="400"><tspan x="1645" dy="0">Container instance · bounded samples and read models.</tspan></text><path d="M 1375 585 C 1375 565 1915 565 1915 585 L 1915 675 C 1915 695 1375 695 1375 675 Z" fill="#e7f5f2" stroke="#087f73" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" /><ellipse cx="1645" cy="585" rx="270" ry="20" fill="#e7f5f2" stroke="#087f73" stroke-width="1.7"/><text class="" x="1645" y="615" text-anchor="middle" font-size="17" fill="#14263d" font-weight="700"><tspan x="1645" dy="0">Audit Store</tspan></text><text class="" x="1645" y="635" text-anchor="middle" font-size="12" fill="#52657d" font-weight="400" font-style="italic"><tspan x="1645" dy="0">SQLite · separate database · append-only/hash chain</tspan></text><text class="" x="1645" y="655" text-anchor="middle" font-size="12" fill="#14263d" font-weight="400"><tspan x="1645" dy="0">Action and recovery evidence.</tspan></text><rect x="1380" y="885" width="530" height="100" rx="12" fill="#eef2f6" stroke="#64748b" stroke-width="1.6"/><text class="" x="1645" y="916" text-anchor="middle" font-size="20" fill="#14263d" font-weight="700"><tspan x="1645" dy="0">Linux kernel interfaces</tspan></text><text class="" x="1645" y="941" text-anchor="middle" font-size="14" fill="#52657d" font-weight="400" font-style="italic"><tspan x="1645" dy="0">procfs · PSI · cgroups v2</tspan></text><text class="" x="1645" y="971" text-anchor="middle" font-size="16" fill="#14263d" font-weight="400"><tspan x="1645" dy="0">External host APIs for observations and gated resource controls.</tspan></text><text class="" x="75" y="1160" text-anchor="start" font-size="13" fill="#52657d" font-weight="400"><tspan x="75" dy="0">Key: nested frames show the physical / virtual host and Ubuntu execution environment; blue rounded boxes are application containers, teal cylinders are the separate SQLite databases, and grey boxes are external host services/APIs. Dashed arrows show labeled one-way dependencies in the project style.</tspan></text><text class="" x="75" y="1210" text-anchor="start" font-size="13" fill="#52657d" font-weight="400"><tspan x="75" dy="0">Validate controller availability, cgroup delegation, service identity, I/O device support, and the final deployment topology before implementation.</tspan></text></svg>