<svg xmlns="http://www.w3.org/2000/svg" width="2600px" height="1500px" viewBox="0 0 2600 1500"><rect width="2600" height="1500" fill="#fff"/><style>text{font-family:Arial,Helvetica,sans-serif;fill:#14263d} .title{font-size:32px;font-weight:700}.subtitle{font-size:18px;fill:#52657d} .layer{font-size:16px;font-weight:700;fill:#1769aa} .small{font-size:13px;fill:#52657d}</style><text class="title" x="48" y="48">C4 Component Diagram — Read-only Dashboard API</text><text class="subtitle" x="50" y="76">Scope: one C4 container · proposed design · supporting systems are outside the container boundary.</text><rect x="570" y="140" width="1610" height="1240" rx="16" fill="#f4f8fc" stroke="#1769aa" stroke-width="2"/><text class="" x="595" y="173" text-anchor="start" font-size="19" fill="#1769aa" font-weight="700"><tspan x="595" dy="0">Read-only Dashboard API — C4 container boundary</tspan></text><g class="entity" data-component="Read-only HTTP Routes"><rect x="640" y="220" width="540" height="220" rx="10" fill="#fff" stroke="#1769aa" stroke-width="2"/><rect x="633" y="228" width="14" height="8" rx="1" fill="#fff" stroke="#1769aa" stroke-width="1.5"/><rect x="633" y="242" width="14" height="8" rx="1" fill="#fff" stroke="#1769aa" stroke-width="1.5"/><text class="" x="662" y="252" text-anchor="start" font-size="20" fill="#14263d" font-weight="700"><tspan x="662" dy="0">Read-only HTTP Routes</tspan></text><text class="" x="662" y="277" text-anchor="start" font-size="14" fill="#52657d" font-weight="400" font-style="italic"><tspan x="662" dy="0">[Component: FastAPI]</tspan></text><text class="" x="662" y="309" text-anchor="start" font-size="16" fill="#14263d" font-weight="400"><tspan x="662" dy="0">Serves status, recommendations, safety health, and</tspan><tspan x="662" dy="20">audit views only.</tspan></text></g><g class="entity" data-component="Projection Query Service"><rect x="1450" y="220" width="540" height="220" rx="10" fill="#fff" stroke="#1769aa" stroke-width="2"/><rect x="1